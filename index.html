<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Command Center v2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0e11; color: #eaecef; font-family: 'Inter', sans-serif; }
        .card { background-color: #181a20; border: 1px solid #2b3139; }
        .metric-label { color: #848e9c; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .metric-value { font-family: 'Roboto Mono', monospace; font-weight: 600; }
        .pos-long { border-left: 4px solid #0ecb81; }
        .pos-short { border-left: 4px solid #f6465d; }
        .up { color: #0ecb81; }
        .down { color: #f6465d; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-white">CRYPTO COMMAND <span class="text-yellow-500">2.0</span></h1>
                <p class="text-sm text-gray-500">Live API Feed: Bybit Linear Perps</p>
            </div>
            <div class="text-right">
                <p class="metric-label">Total Unrealized PnL</p>
                <p id="total-pnl" class="text-2xl metric-value">$0.00</p>
            </div>
        </header>

        <div id="dashboard-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
            <div class="p-10 text-center col-span-full text-gray-500 animate-pulse">A ligar ao motor Supabase...</div>
        </div>
    </div>

    <script>
        // CONFIGURAÇÃO DOS TEUS DADOS REAIS
        const SUPABASE_URL = 'https://qjzjxtxrlofnoyaaypbu.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_bRa-mZWTaf0g6sNyWL9OmQ_uvo7Ex5H';
        
        // CONSTRUÇÃO DA URL DA FUNÇÃO (Caminho completo)
        const FUNC_PATH = `${SUPABASE_URL}/functions/v1/get-bybit-positions`;

        async function fetchPositions() {
            try {
                console.log("A tentar ligar a:", FUNC_PATH);
                const response = await fetch(FUNC_PATH, {
                    method: 'GET',
                    headers: { 
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    const errorMsg = await response.text();
                    throw new Error(`Erro ${response.status}: ${errorMsg}`);
                }

                const result = await response.json();
                console.log("Dados recebidos:", result);
                
                if (result.result && result.result.list) {
                    const activePositions = result.result.list.filter(p => parseFloat(p.size) !== 0);
                    if (activePositions.length > 0) {
                        renderDashboard(activePositions);
                    } else {
                        document.getElementById('dashboard-grid').innerHTML = `<div class='col-span-full text-gray-500 text-center'>Sem posições abertas na Bybit.</div>`;
                    }
                }
            } catch (err) {
                console.error("Detalhe do Erro:", err.message);
                document.getElementById('dashboard-grid').innerHTML = `
                    <div class='col-span-full text-red-500 text-center bg-red-900/20 p-6 rounded-lg border border-red-500/50'>
                        <p class='font-bold'>Erro ao carregar dados</p>
                        <p class='text-sm opacity-80'>${err.message}</p>
                        <p class='text-[10px] mt-2 text-gray-400'>Verifica se a função 'get-bybit-positions' está ativa no Supabase.</p>
                    </div>`;
            }
        }

        function renderDashboard(positions) {
            const grid = document.getElementById('dashboard-grid');
            let totalPnL = 0;
            grid.innerHTML = '';

            positions.forEach(pos => {
                const entry = parseFloat(pos.avgPrice);
                const current = parseFloat(pos.markPrice);
                const qty = parseFloat(pos.size);
                const netPnL = parseFloat(pos.unrealisedPnl);
                const tp = parseFloat(pos.takeProfit);
                
                const diffAbs = current - entry;
                const diffRel = entry !== 0 ? (diffAbs / entry) * 100 : 0;
                const mktValue = current * qty;
                const sideClass = pos.side === 'Buy' ? 'pos-long' : 'pos-short';
                const statusClass = netPnL >= 0 ? 'up' : 'down';

                totalPnL += netPnL;

                grid.innerHTML += `
                    <div class="card p-5 rounded-xl ${sideClass} shadow-lg border border-gray-800">
                        <div class="flex justify-between items-center mb-4">
                            <h2 class="text-lg font-bold text-white">${pos.symbol} <span class="text-xs font-normal text-gray-500">${pos.leverage}x</span></h2>
                            <span class="text-[10px] bg-gray-800 px-2 py-1 rounded text-gray-400 font-bold">${pos.side.toUpperCase()}</span>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <p class="metric-label">Entrada</p>
                                <p class="metric-value">$${entry.toFixed(4)}</p>
                            </div>
                            <div>
                                <p class="metric-label">Preço Atual</p>
                                <p class="metric-value ${statusClass}">$${current.toFixed(4)}</p>
                            </div>
                            <div>
                                <p class="metric-label">Diferença (Abs)</p>
                                <p class="metric-value ${statusClass}">${diffAbs >= 0 ? '+' : ''}${diffAbs.toFixed(4)}</p>
                            </div>
                            <div>
                                <p class="metric-label">Diferença (%)</p>
                                <p class="metric-value ${statusClass}">${diffRel.toFixed(2)}%</p>
                            </div>
                            <div>
                                <p class="metric-label">Market Value</p>
                                <p class="metric-value text-white">$${mktValue.toFixed(2)}</p>
                            </div>
                            <div>
                                <p class="metric-label text-yellow-500">Take Profit</p>
                                <p class="metric-value text-yellow-500">${tp > 0 ? '$' + tp.toFixed(4) : 'N/A'}</p>
                            </div>
                            <div class="col-span-2 bg-gray-900/50 p-3 rounded-lg flex justify-between items-center mt-2">
                                <p class="metric-label">PnL Líquido</p>
                                <p class="text-xl metric-value ${statusClass}">$${netPnL.toFixed(2)}</p>
                            </div>
                        </div>
                    </div>
                `;
            });

            document.getElementById('total-pnl').innerText = `$${totalPnL.toFixed(2)}`;
            document.getElementById('total-pnl').className = `text-2xl metric-value ${totalPnL >= 0 ? 'up' : 'down'}`;
        }

        setInterval(fetchPositions, 10000);
        fetchPositions();
    </script>
</body>
</html>
