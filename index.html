<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>FleetWise Supabase Dashboard - Margem USDT</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #131722; color: #d1d4dc; font-family: sans-serif; padding: 20px; }
        .container { max-width: 1100px; margin: auto; background: #1e222d; padding: 25px; border-radius: 12px; border: 1px solid #363c4e; }
        .form-group { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: flex-end; }
        .input-box { display: flex; flex-direction: column; flex: 1; min-width: 150px; }
        label { font-size: 12px; color: #787b86; margin-bottom: 5px; }
        input { background: #2a2e39; border: 1px solid #363c4e; color: white; padding: 10px; border-radius: 4px; }
        button { background: #2962ff; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; height: 38px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; color: #787b86; padding: 12px; border-bottom: 2px solid #363c4e; font-size: 13px; }
        td { padding: 12px; border-bottom: 1px solid #2a2e39; }
        .liq-price { color: #f23645; font-weight: bold; }
        .token-qty { font-size: 11px; color: #787b86; }
    </style>
</head>
<body>

<div class="container">
    <h2>Registo de Trades (Entrada por Margem $)</h2>
    
    <div class="form-group">
        <div class="input-box">
            <label>Ticker</label>
            <input type="text" id="symbol" placeholder="Ex: APTUSDT">
        </div>
        <div class="input-box">
            <label>Preço de Entrada</label>
            <input type="number" id="avg_price" step="0.0001" placeholder="0.0000">
        </div>
        <div class="input-box">
            <label>Margem Adicionada ($)</label>
            <input type="number" id="margin_usdt" step="0.01" placeholder="Ex: 1135.00">
        </div>
        <div class="input-box">
            <label>Alavancagem (x)</label>
            <input type="number" id="leverage" step="0.1" placeholder="Ex: 2.5">
        </div>
        <button onclick="saveTrade()">Registar Trade</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Ativo</th>
                <th>Preço Médio</th>
                <th>Margem ($)</th>
                <th>Leverage</th>
                <th>Exposição (Tokens)</th>
                <th>Liquidação (Est.)</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="trade-list"></tbody>
    </table>
</div>

<script>
    // CREDENCIAIS DO SUPABASE
    const SUPABASE_URL = 'https://TEU_PROJECTO.supabase.co';
    const SUPABASE_KEY = 'TUA_ANON_KEY';
    const supabase = lib.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadTrades() {
        const { data, error } = await supabase.from('trades').select('*');
        if (error) return console.error(error);
        
        const list = document.getElementById('trade-list');
        list.innerHTML = '';
        data.forEach(t => {
            // Cálculo da Liquidação (Long padrão)
            const liq = t.avg_price * (1 - (0.94 / t.leverage));
            // Cálculo da Quantidade de Tokens baseado na margem e leverage
            const tokens = (t.margin_usdt * t.leverage) / t.avg_price;

            list.innerHTML += `
                <tr>
                    <td><b>${t.symbol}</b></td>
                    <td>${t.avg_price.toFixed(4)}</td>
                    <td>$${t.margin_usdt.toLocaleString()}</td>
                    <td>${t.leverage}x</td>
                    <td class="token-qty">${tokens.toFixed(2)} tokens</td>
                    <td class="liq-price">${liq.toFixed(4)}</td>
                    <td><button style="background:#f23645" onclick="deleteTrade('${t.id}')">Remover</button></td>
                </tr>`;
        });
    }

    async function saveTrade() {
        const trade = {
            symbol: document.getElementById('symbol').value.toUpperCase(),
            avg_price: parseFloat(document.getElementById('avg_price').value),
            margin_usdt: parseFloat(document.getElementById('margin_usdt').value),
            leverage: parseFloat(document.getElementById('leverage').value)
        };
        
        const { error } = await supabase.from('trades').insert([trade]);
        if (error) alert("Erro ao guardar: " + error.message);
        
        loadTrades();
        // Limpar campos
        document.getElementById('symbol').value = '';
        document.getElementById('avg_price').value = '';
        document.getElementById('margin_usdt').value = '';
        document.getElementById('leverage').value = '';
    }

    async function deleteTrade(id) {
        if(confirm("Desejas remover este trade?")) {
            await supabase.from('trades').delete().eq('id', id);
            loadTrades();
        }
    }

    loadTrades();
</script>
</body>
</html>
