<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Command Center v2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0e11; color: #eaecef; font-family: 'Inter', sans-serif; }
        .card { background-color: #181a20; border: 1px solid #2b3139; }
        .metric-label { color: #848e9c; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .metric-value { font-family: 'Roboto Mono', monospace; font-weight: 600; }
        .pos-long { border-left: 4px solid #0ecb81; }
        .pos-short { border-left: 4px solid #f6465d; }
        .up { color: #0ecb81; }
        .down { color: #f6465d; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-white">CRYPTO COMMAND <span class="text-yellow-500">2.0</span></h1>
                <p class="text-sm text-gray-500">Live API Feed: Bybit Linear Perps</p>
            </div>
            <div class="text-right">
                <p class="metric-label">Total Unrealized PnL</p>
                <p id="total-pnl" class="text-2xl metric-value">$0.00</p>
            </div>
        </header>

        <div id="dashboard-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
            <div id="loading-state" class="p-10 text-center col-span-full text-gray-500 animate-pulse">A procurar posições ativas...</div>
        </div>
    </div>

    <script>
        // --- CONFIGURAÇÃO CORRIGIDA ---
        const PROJECT_ID = 'qjzjxtxrlofnoyaaypbu'; // Apenas o ID, sem o https://
        const SUPABASE_KEY = 'sb_publishable_bRa-mZWTaf0g6sNyWL9OmQ_uvo7Ex5H';
        
        const SUPABASE_URL = `https://${PROJECT_ID}.supabase.co`;
        const FUNC_PATH = `${SUPABASE_URL}/functions/v1/get-bybit-positions`;

        async function fetchPositions() {
            try {
                const response = await fetch(FUNC_PATH, {
                    method: 'GET',
                    headers: { 
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    const errorMsg = await response.text();
                    throw new Error(`Erro ${response.status}: ${errorMsg}`);
                }

                const result = await response.json();

                if (result.result && result.result.list) {
                    const activePositions = result.result.list.filter(p => parseFloat(p.size) !== 0);
                    renderDashboard(activePositions);
                } else {
                    document.getElementById('dashboard-grid').innerHTML = `<div class='col-span-full text-center text-gray-500'>Nenhuma posição aberta encontrada na Bybit.</div>`;
                }
            } catch (err) {
                console.error("Erro na busca:", err.message);
                document.getElementById('dashboard-grid').innerHTML = `
                    <div class='col-span-full text-center text-red-500 bg-red-900/10 p-6 rounded-lg border border-red-500/50'>
                        <p class='font-bold text-lg'>Erro de Ligação</p>
                        <p class='text-sm mb-2'>${err.message}</p>
                        <p class='text-[10px] text-gray-400'>Verifica se a função 'get-bybit-positions' foi publicada (deployed) para o ID ${PROJECT_ID}.</p>
                    </div>`;
            }
        }

        function renderDashboard(positions) {
            const grid = document.getElementById('dashboard-grid');
            let totalPnL = 0;
            
            if (positions.length === 0) {
                grid.innerHTML = `<div class='col-span-full text-center text-gray-500'>Sem posições ativas.</div>`;
                return;
            }

            grid.innerHTML = '';

            positions.forEach(pos => {
                const entry = parseFloat(pos.avgPrice) || 0;
                const current = parseFloat(pos.markPrice) || 0;
                const qty = Math.abs(parseFloat(pos.size)) || 0;
                const netPnL = parseFloat(pos.unrealisedPnl) || 0;
                const tp = parseFloat(pos.takeProfit) || 0;
                const liq = parseFloat(pos.liqPrice) || 0;
                const leverage = parseFloat(pos.leverage) || 1;
                
                const mktValue = current * qty;
                const marginUsed = leverage > 0 ? (mktValue / leverage) : 0;
                const roeReal = marginUsed > 0 ? ((netPnL / marginUsed) * 100) : 0;
                
                const sideClass = pos.side === 'Buy' ? 'pos-long' : 'pos-short';
                const statusClass = netPnL >= 0 ? 'up' : 'down';

                totalPnL += netPnL;

                grid.innerHTML += `
                    <div class="card p-5 rounded-xl ${sideClass} shadow-lg border border-gray-800">
                        <div class="flex justify-between items-center mb-4">
                            <h2 class="text-lg font-bold text-white">${pos.symbol} <span class="text-xs font-normal text-gray-500">${leverage}x</span></h2>
                            <span class="text-[10px] bg-gray-800 px-2 py-1 rounded text-gray-400 font-bold">${pos.side.toUpperCase()}</span>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <p class="metric-label">Entrada</p>
                                <p class="metric-value text-gray-300">$${entry.toFixed(4)}</p>
                            </div>
                            <div>
                                <p class="metric-label">Preço Atual</p>
                                <p class="metric-value ${statusClass}">$${current.toFixed(4)}</p>
                            </div>
                            
                            <div>
                                <p class="metric-label text-red-500">Liquidação</p>
                                <p class="metric-value text-red-500 font-bold">${liq > 0 ? '$' + liq.toFixed(4) : 'N/A'}</p>
                            </div>
                            <div>
                                <p class="metric-label font-bold">ROE (Real %)</p>
                                <p class="metric-value ${statusClass} text-lg">${roeReal >= 0 ? '+' : ''}${roeReal.toFixed(2)}%</p>
                            </div>

                            <div>
                                <p class="metric-label">Market Value</p>
                                <p class="metric-value text-white">$${mktValue.toFixed(2)}</p>
                            </div>
                            <div>
                                <p class="metric-label text-yellow-500">Take Profit</p>
                                <p class="metric-value text-yellow-500 font-medium">${tp > 0 ? '$' + tp.toFixed(4) : 'N/A'}</p>
                            </div>

                            <div class="col-span-2 bg-gray-900/50 p-3 rounded-lg flex justify-between items-center mt-2 border border-gray-800">
                                <div>
                                    <p class="metric-label">Margem Usada</p>
                                    <p class="metric-value text-sm text-gray-400">$${marginUsed.toFixed(2)}</p>
                                </div>
                                <div class="text-right">
                                    <p class="metric-label">PnL Líquido</p>
                                    <p class="text-xl metric-value ${statusClass}">$${netPnL.toFixed(2)}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            const totalEl = document.getElementById('total-pnl');
            totalEl.innerText = `$${totalPnL.toFixed(2)}`;
            totalEl.className = `text-2xl metric-value ${totalPnL >= 0 ? 'up' : 'down'}`;
        }

        fetchPositions();
        setInterval(fetchPositions, 10000);
    </script>
</body>
</html>
