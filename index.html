<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Trading Lab - v12.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --risk-rgb: 2, 211, 134; }
        body { 
            background-color: #080a0c; color: #f0f2f5; font-family: 'Outfit', sans-serif; 
            -webkit-font-smoothing: antialiased; transition: background 1.5s ease;
            background-image: radial-gradient(circle at top right, rgba(var(--risk-rgb), 0.15), transparent 800px);
            min-height: 100vh;
        }
        .card { background: rgba(24, 26, 32, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 12px; }
        .metric-label { color: #848e9c; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; }
        .metric-value { font-family: 'Roboto Mono', monospace; font-weight: 700; }
        .up { color: #02d386 !important; } .down { color: #ff3b5c !important; }
        .stat-box { background: rgba(30, 33, 38, 0.5); border: 1px solid rgba(255, 255, 255, 0.03); padding: 12px; border-radius: 8px; }
        
        /* Fibonacci Mini-Display */
        .fib-line { font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; background: rgba(255,255,255,0.03); display: flex; justify-content: space-between; }
        .fib-gold { border-left: 2px solid #f3ba2f; background: rgba(243, 186, 47, 0.05); }

        .progress-bg { background-color: #2b3139; height: 6px; border-radius: 3px; width: 100%; margin-top: 4px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 3px; transition: width 0.8s ease; }
        
        .ai-glow { 
            color: #f3ba2f; 
            text-shadow: 0 0 20px rgba(243, 186, 47, 0.6), 0 0 40px rgba(243, 186, 47, 0.3);
            font-weight: 800;
        }

        .chart-wrapper { display: none; height: 500px; width: 100%; border-top: 1px solid rgba(255, 255, 255, 0.1); margin-top: 15px; }
        .chart-wrapper.active { display: block; }

        .layout-container { display: flex; flex-direction: column; gap: 24px; max-width: 1600px; margin: 0 auto; padding: 20px; }
        @media (min-width: 1280px) {
            .layout-container { flex-direction: row; align-items: flex-start; }
            #main-content { flex: 1; }
            #ai-section { width: 525px; position: sticky; top: 20px; height: calc(100vh - 40px); display: flex; flex-direction: column; }
        }
        .rotate-icon { transition: transform 0.3s ease; }
        .rotate-180 { transform: rotate(180deg); }
    </style>
</head>
<body>
    <div class="layout-container">
        <main id="main-content">
            <header class="mb-10">
                <div class="mb-8 border-b border-gray-800/40 pb-6">
                    <h1 class="text-5xl font-extrabold text-white tracking-tight leading-none mb-3">
                        <span class="ai-glow">AI</span> Trading Lab
                    </h1>
                    <div class="flex items-center gap-3">
                        <span class="w-2.5 h-2.5 bg-green-500 rounded-full animate-pulse shadow-[0_0_8px_#22c55e]"></span>
                        <p id="update-timestamp" class="text-[9px] text-gray-500 font-mono tracking-[0.2em] uppercase font-bold">Terminal Operational</p>
                    </div>
                </div>

                <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                    <div class="stat-box">
                        <p class="metric-label text-gray-400">PnL Global</p>
                        <div class="flex items-baseline gap-2">
                            <p id="total-pnl" class="text-xl metric-value">$0</p>
                            <p id="total-pnl-perc" class="text-[10px] metric-value">0,00%</p>
                        </div>
                    </div>
                    <div class="stat-box"><p class="metric-label text-gray-400">Exposição</p><p id="total-exposure" class="text-xl metric-value text-white">$0</p></div>
                    <div class="stat-box"><p class="metric-label text-gray-400">Margem</p><p id="total-margin" class="text-xl metric-value text-gray-300">$0</p></div>
                    <div class="stat-box border-yellow-500/10"><p class="metric-label text-yellow-500 font-bold">Alavancagem</p><p id="avg-leverage" class="text-xl metric-value text-yellow-500">0,00x</p></div>
                </div>
            </header>
            <div id="dashboard-grid" class="grid grid-cols-1 md:grid-cols-2 gap-5"></div>
        </main>

        <aside id="ai-section" class="card p-6">
            <div class="flex justify-between items-center mb-6 border-b border-gray-800 pb-4">
                <div class="flex items-center gap-3">
                    <span id="engine-led" class="w-2.5 h-2.5 bg-green-500 rounded-full"></span>
                    <span class="text-white text-[11px] font-bold uppercase tracking-widest">Baltazar 2.0 Engine</span>
                </div>
                <span id="fg-index" class="text-[10px] font-bold text-gray-500 font-mono bg-white/5 px-2 py-1 rounded">F&G: SYNCING...</span>
            </div>
            <div id="ai-content" class="flex-grow overflow-y-auto mb-4 pr-2 text-sm leading-relaxed scrollbar-hide">
                <div class="insight-card text-gray-500 text-center py-10">A aguardar telemetria...</div>
            </div>
            <div class="pt-4 border-t border-gray-800">
                <input type="text" id="chat-input" placeholder="Comando..." class="w-full bg-transparent text-white outline-none text-sm placeholder-gray-700" onkeypress="handleChat(event)">
            </div>
        </aside>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        const PROJECT_ID = 'qjzjxtxrlofnoyaaypbu'; 
        const SUPABASE_KEY = 'sb_publishable_bRa-mZWTaf0g6sNyWL9OmQ_uvo7Ex5H';
        const FUNC_PATH = `https://${PROJECT_ID}.supabase.co/functions/v1/get-bybit-positions`;
        const AI_FUNC_PATH = `https://${PROJECT_ID}.supabase.co/functions/v1/trade-advisor`;

        let currentPositions = [];
        let isInitialLoad = true;

        window.onload = () => { fetchPositions(); setInterval(fetchPositions, 10000); };

        function formatNumber(num) {
            const sign = num < 0 ? "-" : "";
            return sign + "$" + Math.floor(Math.abs(num)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        }

        function formatDecimal(num, p = 2) { return num.toFixed(p).replace('.', ','); }

        async function fetchPositions() {
            try {
                const response = await fetch(FUNC_PATH, { method: 'GET', headers: { 'Authorization': `Bearer ${SUPABASE_KEY}` } });
                const result = await response.json();
                if (result.result?.list) {
                    currentPositions = result.result.list.filter(p => parseFloat(p.size) !== 0);
                    updateDashboard(currentPositions);
                    updateRiskSemaphore(currentPositions);
                    document.getElementById('update-timestamp').innerText = `Terminal: ${new Date().toLocaleTimeString()}`;
                    if(isInitialLoad && currentPositions.length > 0) { fetchAIIntelligence(); isInitialLoad = false; }
                }
            } catch (err) { console.error(err); }
        }

        function updateRiskSemaphore(positions) {
            let maxRisk = 0;
            positions.forEach(pos => {
                const liq = parseFloat(pos.liqPrice), mark = parseFloat(pos.markPrice);
                const dist = liq > 0 ? Math.abs((liq - mark) / mark) * 100 : 100;
                if (dist < 12) maxRisk = 2; else if (dist < 25 && maxRisk < 2) maxRisk = 1;
            });
            const led = document.getElementById('engine-led');
            if (maxRisk === 2) { document.body.style.setProperty('--risk-rgb', '255, 59, 92'); led.className = "w-2.5 h-2.5 bg-red-500 rounded-full animate-ping"; }
            else if (maxRisk === 1) { document.body.style.setProperty('--risk-rgb', '243, 186, 47'); led.className = "w-2.5 h-2.5 bg-yellow-500 rounded-full animate-ping"; }
            else { document.body.style.setProperty('--risk-rgb', '2, 211, 134'); led.className = "w-2.5 h-2.5 bg-green-500 rounded-full shadow-[0_0_10px_rgba(34,197,94,0.5)]"; }
        }

        function updateDashboard(positions) {
            const grid = document.getElementById('dashboard-grid');
            let totalPnL = 0, totalExposure = 0, totalMargin = 0;

            positions.forEach(pos => {
                const entry = parseFloat(pos.avgPrice), current = parseFloat(pos.markPrice);
                const netPnL = parseFloat(pos.unrealisedPnl), leverage = parseFloat(pos.leverage);
                const mValue = parseFloat(pos.positionValue);
                const tp = parseFloat(pos.takeProfit), liq = parseFloat(pos.liqPrice);
                const margin = mValue / leverage; 
                totalPnL += netPnL; totalExposure += mValue; totalMargin += margin;

                let card = document.getElementById(`card-${pos.symbol}`);
                if (!card) {
                    card = document.createElement('div');
                    card.id = `card-${pos.symbol}`;
                    card.className = `card border-l-4 overflow-hidden ${pos.side === 'Buy' ? 'border-l-green-500' : 'border-l-red-500'}`;
                    card.innerHTML = `
                        <div class="p-5">
                            <div class="flex justify-between items-center mb-5">
                                <h2 class="text-xl font-black text-white uppercase tracking-tighter">${pos.symbol} <span class="text-xs text-yellow-500 bg-yellow-500/10 px-2 py-1 rounded ml-2 font-bold">${formatDecimal(leverage)}x</span></h2>
                                <button onclick="handleChartToggle('${pos.symbol}')" class="text-gray-500 p-2">
                                    <svg id="arrow-${pos.symbol}" class="w-6 h-6 rotate-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                </button>
                            </div>
                            <div id="metrics-${pos.symbol}" class="grid grid-cols-2 gap-y-4 text-gray-400"></div>
                            <div id="fib-${pos.symbol}" class="mt-4 grid grid-cols-1 gap-1 border-t border-white/5 pt-3"></div>
                        </div>
                        <div id="wrap-${pos.symbol}" class="chart-wrapper"><div id="tv-${pos.symbol}" style="height: 100%; width: 100%;"></div></div>`;
                    grid.appendChild(card);
                }

                const dLiq = liq > 0 ? Math.abs((liq - current) / current) * 100 : 100;
                const tpP = tp > 0 ? (Math.abs(current - entry) / Math.abs(tp - entry)) * 100 : 0;
                const pnlStatus = netPnL >= 0 ? 'up' : 'down';

                document.getElementById(`metrics-${pos.symbol}`).innerHTML = `
                    <div><p class="metric-label">ROE</p><p class="${pnlStatus} text-2xl font-black">${formatDecimal((netPnL/margin)*100)}%</p></div>
                    <div class="text-right"><p class="metric-label">PnL</p><p class="${pnlStatus} text-xl font-bold">${formatNumber(netPnL)}</p></div>
                    <div class="pt-2 border-t border-gray-800/50"><p class="metric-label">Tamanho USD</p><p class="text-sm font-bold text-gray-200">${formatNumber(mValue)}</p></div>
                    <div class="text-right pt-2 border-t border-gray-800/50"><p class="metric-label">Entrada / Mercado</p><p class="text-sm font-bold text-gray-200">${formatDecimal(entry, 4)}</p><p class="text-[10px] text-gray-500 font-mono">${formatDecimal(current, 4)}</p></div>
                `;
            });

            document.getElementById('total-pnl').innerText = formatNumber(totalPnL);
            document.getElementById('total-pnl').className = `text-xl metric-value ${totalPnL >= 0 ? 'up' : 'down'}`;
            document.getElementById('total-pnl-perc').innerText = `${formatDecimal(totalMargin > 0 ? (totalPnL/totalMargin*100) : 0)}%`;
            document.getElementById('total-pnl-perc').className = `text-[10px] metric-value ${totalPnL >= 0 ? 'up' : 'down'}`;
            document.getElementById('total-exposure').innerText = formatNumber(totalExposure);
            document.getElementById('total-margin').innerText = formatNumber(totalMargin);
            document.getElementById('avg-leverage').innerText = formatDecimal(totalMargin > 0 ? (totalExposure / totalMargin) : 0) + 'x';
        }

        async function fetchAIIntelligence(userQuery = null) {
            const aiContent = document.getElementById('ai-content');
            try {
                const response = await fetch(AI_FUNC_PATH, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ positions: currentPositions, userMessage: userQuery })
                });
                const data = await response.json();
                
                // ATUALIZAR NÍVEIS VISUAIS SE DISPONÍVEIS
                if (data.positionsTech) {
                    data.positionsTech.forEach(tech => {
                        const fibDiv = document.getElementById(`fib-${tech.symbol}`);
                        if (fibDiv) {
                            fibDiv.innerHTML = `
                                <div class="fib-line"><span class="text-gray-500">RESISTÊNCIA (R1)</span><span class="text-red-400 font-bold">${tech.resistance}</span></div>
                                <div class="fib-line fib-gold"><span class="text-yellow-500 font-bold">GOLDEN RATIO (0.618)</span><span class="text-yellow-500 font-bold">${tech.fib.level618}</span></div>
                                <div class="fib-line"><span class="text-gray-500">SUPORTE (S1)</span><span class="text-green-400 font-bold">${tech.support}</span></div>
                            `;
                        }
                    });
                }

                document.getElementById('fg-index').innerText = `F&G: ${data.fg || '--'}`;
                const formatted = data.insight.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
                const newCard = document.createElement('div');
                newCard.className = 'border-l-2 border-yellow-500 pl-4 mb-6 text-white font-medium';
                aiContent.appendChild(newCard);
                let i = 0;
                function type() {
                    if (i < formatted.length) {
                        if (formatted.substring(i, i+4) === '<br>') { newCard.innerHTML += '<br>'; i += 4; }
                        else if (formatted.substring(i, i+8) === '<strong>') {
                            let end = formatted.indexOf('</strong>', i);
                            newCard.innerHTML += formatted.substring(i, end + 9); i = end + 9;
                        } else { newCard.innerHTML += formatted.charAt(i); i++; }
                        aiContent.scrollTop = aiContent.scrollHeight;
                        setTimeout(type, 8);
                    }
                }
                type();
            } catch (err) { console.error(err); }
        }

        function handleChartToggle(s) {
            const w = document.getElementById(`wrap-${s}`);
            const a = document.getElementById(`arrow-${s}`);
            const isActive = w.classList.toggle('active');
            a.classList.toggle('rotate-180');
            if (isActive && !w.dataset.loaded) {
                new TradingView.widget({ "autosize": true, "symbol": `BYBIT:${s}.P`, "interval": "60", "theme": "dark", "style": "1", "container_id": `tv-${s}`, "hide_side_toolbar": true });
                w.dataset.loaded = "true";
            }
        }

        function handleChat(e) { if (e.key === 'Enter') { fetchAIIntelligence(e.target.value); e.target.value = ''; } }
    </script>
</body>
</html>
