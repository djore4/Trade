<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Trading Lab - v24.5 Clean UI</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --risk-rgb: 2, 211, 134; --yellow-binance: #f3ba2f; }
        body { 
            background-color: #080a0c; color: #f0f2f5; font-family: 'Outfit', sans-serif; 
            -webkit-font-smoothing: antialiased; background-image: radial-gradient(circle at top right, rgba(var(--risk-rgb), 0.1), transparent 800px);
            min-height: 100vh; overflow-x: hidden;
        }
        .card { background: rgba(24, 26, 32, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 12px; }
        .metric-label { color: #848e9c; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.15em; font-weight: 800; }
        .metric-value { font-family: 'Roboto Mono', monospace; font-weight: 700; }
        
        .nav-btn { padding: 12px 20px; font-weight: 800; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: #848e9c; border-bottom: 2px solid transparent; transition: 0.3s; white-space: nowrap; }
        .nav-btn.active { color: var(--yellow-binance); border-bottom-color: var(--yellow-binance); }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease; }

        .app-grid { display: grid; grid-template-columns: 1fr; gap: 20px; padding: 20px; max-width: 1800px; margin: 0 auto; transition: all 0.4s ease; }
        
        @media (min-width: 1280px) { 
            .app-grid.chat-open { grid-template-columns: 1fr 450px; } 
            #ai-section { height: calc(100vh - 120px); position: sticky; top: 100px; } 
        }
        
        #ai-section { display: none; flex-direction: column; scroll-behavior: smooth; }
        #ai-section.open { display: flex; }
        
        .msg { margin-bottom: 20px; padding: 16px; border-radius: 14px; font-size: 0.95rem; line-height: 1.8; }
        .bot-msg { background: rgba(243, 186, 47, 0.04); border-left: 4px solid var(--yellow-binance); color: #e1e1e1; }
        .user-msg { background: rgba(0, 170, 255, 0.1); border-right: 4px solid #00aaff; align-self: flex-end; text-align: right; color: #e6f4ff; }
        
        .progress-bg { background-color: #1e2329; height: 6px; border-radius: 3px; width: 100%; margin-top: 6px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 3px; transition: width 0.8s ease; }
        
        .typing-indicator { display: flex; gap: 6px; padding: 6px 4px; align-items: center; }
        .typing-dot { width: 6px; height: 6px; background: var(--yellow-binance); border-radius: 50%; animation: typing 1.4s infinite ease-in-out both; }
        @keyframes typing { 0%, 80%, 100% { transform: scale(0); opacity: 0.5; } 40% { transform: scale(1); opacity: 1; } }

        input[type="text"] { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: white; padding: 15px; outline: none; transition: 0.3s; }
        input[type="text"]:focus { border-color: var(--yellow-binance); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <header class="border-b border-gray-800/40 bg-[#080a0c]/90 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-[1800px] mx-auto px-4 md:px-6 py-4 flex flex-col lg:flex-row justify-between items-center gap-4">
            <div class="flex items-center justify-between w-full lg:w-auto gap-4">
                <h1 class="text-xl md:text-3xl font-black text-white tracking-tighter whitespace-nowrap"><span class="text-[#f3ba2f]">AI</span> Trading Lab</h1>
                <nav class="flex gap-2">
                    <button onclick="switchTab('dashboard')" id="btn-dashboard" class="nav-btn active">Dashboard</button>
                    <button onclick="switchTab('simulator')" id="btn-simulator" class="nav-btn">Simulador DCA</button>
                </nav>
            </div>
            <div class="flex items-center gap-4">
                <div id="macro-trend" class="hidden lg:block bg-white/5 px-3 py-1.5 rounded-md border border-white/10 text-[10px] font-black uppercase tracking-widest text-gray-500">Macro: --</div>
                <button onclick="handleAICall()" class="bg-[#f3ba2f] text-black px-6 py-2.5 rounded-xl font-black uppercase text-[10px] shadow-[0_4px_15px_rgba(243,186,47,0.2)] hover:scale-105 transition-all">AI Analysis</button>
            </div>
        </div>
    </header>

    <div id="main-grid" class="app-grid">
        <main>
            <section id="tab-dashboard" class="tab-content active">
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                    <div class="card p-4"><p class="metric-label">PnL Global</p><p id="total-pnl" class="text-xl lg:text-2xl metric-value">$0</p></div>
                    <div class="card p-4"><p class="metric-label">ROE Médio</p><p id="total-pnl-perc" class="text-xl lg:text-2xl metric-value">0,00%</p></div>
                    <div class="card p-4"><p class="metric-label">Exposição Total</p><p id="total-exposure" class="text-xl lg:text-2xl metric-value text-white">$0,00</p></div>
                    <div class="card p-4 border-yellow-500/10"><p class="metric-label text-yellow-500">Alavancagem Real</p><p id="avg-leverage" class="text-xl lg:text-2xl metric-value text-yellow-500">0x</p></div>
                </div>
                <div id="dashboard-grid" class="grid grid-cols-1 lg:grid-cols-2 gap-6"></div>
            </section>

            <section id="tab-simulator" class="tab-content">
                <div class="card p-8 text-center text-gray-500">Simulador DCA Ativo (Interface v24.4)</div>
            </section>
        </main>

        <aside id="ai-section" class="card p-6 flex flex-col">
            <div class="flex justify-between items-center mb-6 border-b border-gray-800 pb-4">
                <span class="text-white text-xs font-black uppercase tracking-widest text-yellow-500">🧠 AI Expert Insights</span>
            </div>
            <div id="ai-content" class="flex-grow overflow-y-auto mb-4 pr-2 flex flex-col scrollbar-hide"></div>
            <input type="text" id="chat-input" placeholder="Perguntar sobre as posições ou macro..." onkeypress="handleChat(event)">
        </aside>
    </div>

    <script>
        const FUNC_PATH = `https://qjzjxtxrlofnoyaaypbu.supabase.co/functions/v1/get-bybit-positions`;
        const AI_FUNC_PATH = `https://qjzjxtxrlofnoyaaypbu.supabase.co/functions/v1/trade-advisor`;
        const SUPABASE_KEY = 'sb_publishable_bRa-mZWTaf0g6sNyWL9OmQ_uvo7Ex5H';
        let currentPositions = [];

        function fPT(n, isM = false, p = 2) {
            let num = Number(n);
            if(isNaN(num) || num === 0) return isM ? "$0,00" : "0,00";
            let res = Math.abs(num).toLocaleString('pt-PT', { minimumFractionDigits: p, maximumFractionDigits: p });
            return (num < 0 ? "-" : "") + (isM ? "$" : "") + res;
        }

        async function fetchPositions() {
            try {
                const r = await fetch(FUNC_PATH, { headers: { 'Authorization': `Bearer ${SUPABASE_KEY}` } });
                const d = await r.json();
                if (d.result?.list) {
                    currentPositions = d.result.list.filter(p => parseFloat(p.size) !== 0);
                    updateDashboard(currentPositions);
                }
            } catch (e) { console.error(e); }
        }

        function updateDashboard(positions) {
            const grid = document.getElementById('dashboard-grid');
            positions.forEach(pos => {
                const pnl = parseFloat(pos.unrealisedPnl), val = parseFloat(pos.positionValue);
                const lev = parseFloat(pos.leverage), ent = parseFloat(pos.avgPrice), cur = parseFloat(pos.markPrice);
                const marg = val / lev;
                
                let card = document.getElementById(`card-${pos.symbol}`);
                if (!card) {
                    card = document.createElement('div'); card.id = `card-${pos.symbol}`;
                    card.className = `card border-l-4 p-5 ${pos.side === 'Buy' ? 'border-l-green-500' : 'border-l-red-500'}`;
                    grid.appendChild(card);
                }

                // NOVO: Valor da posição com (Margem/S. Leverage) entre parênteses
                card.innerHTML = `
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="font-black text-white text-xl uppercase">${pos.symbol} <span class="text-[10px] text-yellow-500 bg-yellow-500/10 px-2 py-1 rounded ml-2">${lev}x</span></h2>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><p class="metric-label">ROE</p><p class="text-2xl font-black ${pnl>=0?'text-green-500':'text-red-500'}">${fPT((pnl/marg)*100)}%</p></div>
                        <div class="text-right"><p class="metric-label">PnL USD</p><p class="text-2xl font-bold ${pnl>=0?'text-green-500':'text-red-500'}">${fPT(pnl, true)}</p></div>
                        <div class="pt-3 border-t border-white/5 col-span-2 flex justify-between items-baseline">
                            <div><p class="metric-label">Valor Posição</p><p class="text-md font-bold text-gray-200">${fPT(val, true)} <span class="text-[11px] text-gray-500 font-normal ml-1">(${fPT(marg, true)})</span></p></div>
                            <div class="text-right"><p class="metric-label">Mark Price</p><p class="text-xs font-mono text-gray-400">${fPT(cur, false, 4)}</p></div>
                        </div>
                    </div>`;
            });
        }

        function cleanResponse(text) {
            // REMOVE TODOS OS # E * DA CONVERSA PARA MELHORAR A LEITURA
            return text
                .replace(/[#*]/g, '') 
                .replace(/\n\n/g, '<br><br>')
                .replace(/\n/g, '<br>')
                .trim();
        }

        async function fetchAIIntelligence(userQuery) {
            const aiContent = document.getElementById('ai-content');
            if (userQuery) aiContent.insertAdjacentHTML('beforeend', `<div class="user-msg msg">${userQuery}</div>`);

            const loadingId = "load-" + Date.now();
            aiContent.insertAdjacentHTML('beforeend', `<div id="${loadingId}" class="bot-msg msg"><div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div>`);
            aiContent.scrollTop = aiContent.scrollHeight;

            try {
                const r = await fetch(AI_FUNC_PATH, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_KEY}`, 'apikey': SUPABASE_KEY },
                    body: JSON.stringify({ positions: currentPositions, userMessage: userQuery || "Faz um resumo do meu portefólio com emojis." })
                });
                
                const d = await r.json();
                const rawText = d.insight || "Sem resposta.";
                const cleanText = cleanResponse(rawText); // FILTRO DE LIMPEZA AQUI

                document.getElementById(loadingId).remove();
                const msgId = "msg-" + Date.now();
                aiContent.insertAdjacentHTML('beforeend', `<div id="${msgId}" class="bot-msg msg"></div>`);
                
                const msgEl = document.getElementById(msgId);
                let i = 0;
                function type() {
                    if (i < cleanText.length) {
                        msgEl.innerHTML = cleanText.substring(0, i + 1);
                        i++;
                        aiContent.scrollTop = aiContent.scrollHeight;
                        setTimeout(type, 5);
                    }
                }
                type();
            } catch (e) { 
                document.getElementById(loadingId).innerText = "Erro na ligação.";
            }
        }

        function handleAICall() {
            document.getElementById('ai-section').classList.toggle('open');
            document.getElementById('main-grid').classList.toggle('chat-open');
            if (document.getElementById('ai-section').classList.contains('open') && document.getElementById('ai-content').innerHTML === "") {
                fetchAIIntelligence();
            }
        }

        function handleChat(e) { if (e.key === 'Enter' && e.target.value.trim() !== "") { fetchAIIntelligence(e.target.value); e.target.value = ''; } }
        function switchTab(t) { /* lógica de abas */ }

        window.onload = fetchPositions;
    </script>
</body>
</html>
