<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Trading Lab v9.8 - Final</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --risk-rgb: 2, 211, 134; }
        body { 
            background-color: #080a0c; color: #f0f2f5; font-family: 'Outfit', sans-serif; 
            -webkit-font-smoothing: antialiased; transition: background 1.5s ease;
            background-image: radial-gradient(circle at top right, rgba(var(--risk-rgb), 0.15), transparent 700px);
        }
        .card { background: rgba(24, 26, 32, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 12px; }
        .metric-label { color: #848e9c; font-size: 0.55rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; }
        .metric-value { font-family: 'Roboto Mono', monospace; font-weight: 700; }
        .up { color: #02d386; } .down { color: #ff3b5c; }
        .stat-box { background: rgba(30, 33, 38, 0.5); border: 1px solid rgba(255, 255, 255, 0.03); padding: 10px; border-radius: 8px; }
        
        /* Barras de Progresso (TP e Liquidação) */
        .progress-bg { background-color: #2b3139; height: 5px; border-radius: 3px; width: 100%; margin-top: 4px; }
        .progress-fill { height: 100%; border-radius: 3px; transition: width 0.6s ease; }

        /* Estilo do Baltazar e Radar */
        .insight-card { border-left: 3px solid #f3ba2f; padding: 16px; margin-bottom: 12px; background: rgba(243, 186, 47, 0.02); font-size: 14px; line-height: 1.8; }
        .insight-card strong { color: #f3ba2f; font-weight: 600; }
        .liq-radar-mini { background: rgba(255, 255, 255, 0.02); border-radius: 8px; padding: 12px; border: 1px solid rgba(243, 186, 47, 0.1); }
        
        .chart-container { height: 550px; width: 100%; border-top: 1px solid rgba(255, 255, 255, 0.05); display: none; }
        .chart-visible { display: block !important; }
        
        .layout-container { display: flex; flex-direction: column; gap: 24px; max-width: 1600px; margin: 0 auto; padding: 20px; }
        @media (min-width: 1280px) {
            .layout-container { flex-direction: row; align-items: flex-start; }
            #main-content { flex: 1; }
            #ai-section { width: 420px; position: sticky; top: 20px; height: calc(100vh - 40px); display: flex; flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="layout-container">
        <main id="main-content" class="w-full">
            <header class="mb-6">
                <div class="flex justify-between items-end mb-6 border-b border-gray-800/40 pb-6 flex-wrap gap-4">
                    <div class="flex items-center gap-4">
                        <svg width="35" height="35" viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="3" fill="#f3ba2f"/></svg>
                        <div>
                            <h1 class="text-3xl font-extrabold text-white tracking-widest uppercase leading-none">AI TRADING LAB</h1>
                            <p id="update-timestamp" class="text-[7px] text-gray-600 font-mono tracking-widest uppercase mt-2">Sync: Operational</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="metric-label">PnL Global Aberto</p>
                        <p id="total-pnl" class="text-3xl metric-value leading-none">$0.00</p>
                        <p id="total-pnl-perc" class="text-base metric-value mt-1">0.00%</p>
                    </div>
                </div>
                <div class="grid grid-cols-2 lg:grid-cols-3 gap-3">
                    <div class="stat-box"><p class="metric-label">Exposure</p><p id="total-exposure" class="text-lg metric-value text-white">$0.00</p></div>
                    <div class="stat-box"><p class="metric-label">Margin</p><p id="total-margin" class="text-lg metric-value text-gray-400">$0.00</p></div>
                    <div class="stat-box border-yellow-500/20"><p class="metric-label text-yellow-500 font-bold">Lev Real</p><p id="avg-leverage" class="text-lg metric-value text-yellow-500">0.00x</p></div>
                </div>
            </header>
            <div id="dashboard-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </main>

        <aside id="ai-section" class="card p-6">
            <div id="liq-radar" class="liq-radar-mini mb-6">
                <p class="text-[10px] font-bold text-yellow-500 mb-3 uppercase tracking-widest">Smart Liquidity Radar</p>
                <div id="liq-list" class="space-y-3 text-[10px] text-gray-600 font-mono">A analisar ímanes de preço...</div>
            </div>

            <div class="flex justify-between items-center mb-4 border-b border-gray-800 pb-4">
                <span class="text-yellow-500 text-[10px] font-extrabold tracking-widest uppercase flex items-center gap-2">
                    <span id="engine-led" class="w-2 h-2 bg-green-500 rounded-full animate-ping"></span> Engine 2.0 Flash
                </span>
                <span id="fg-index" class="text-xs font-bold text-gray-500">F&G: --</span>
            </div>
            <div id="ai-content" class="flex-grow overflow-y-auto mb-4 space-y-4 pr-2 scrollbar-hide">
                <div class="insight-card text-gray-500 text-center" id="bot-status">Baltazar em escuta ativa...</div>
            </div>
            <div class="pt-4 border-t border-gray-800">
                <input type="text" id="chat-input" placeholder="Comando de sobrevivência..." class="w-full bg-transparent text-white p-1 outline-none text-sm placeholder-gray-700" onkeypress="handleChat(event)">
            </div>
        </aside>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        const PROJECT_ID = 'qjzjxtxrlofnoyaaypbu'; 
        const SUPABASE_KEY = 'sb_publishable_bRa-mZWTaf0g6sNyWL9OmQ_uvo7Ex5H';
        const FUNC_PATH = `https://${PROJECT_ID}.supabase.co/functions/v1/get-bybit-positions`;
        const AI_FUNC_PATH = `https://${PROJECT_ID}.supabase.co/functions/v1/trade-advisor`;

        let currentPositions = [];

        window.onload = () => { fetchPositions(); setInterval(fetchPositions, 10000); };

        async function fetchPositions() {
            try {
                const response = await fetch(FUNC_PATH, { method: 'GET', headers: { 'Authorization': `Bearer ${SUPABASE_KEY}` } });
                const result = await response.json();
                if (result.result?.list) {
                    currentPositions = result.result.list.filter(p => parseFloat(p.size) !== 0);
                    updateDashboard(currentPositions);
                    updateRiskSemaphore(currentPositions);
                }
            } catch (err) { console.error(err); }
        }

        function updateRiskSemaphore(positions) {
            let maxRisk = 0;
            positions.forEach(pos => {
                const liq = parseFloat(pos.liqPrice), mark = parseFloat(pos.markPrice);
                const dist = liq > 0 ? Math.abs((liq - mark) / mark) * 100 : 100;
                if (dist < 12) maxRisk = 2; else if (dist < 25) maxRisk = 1;
            });
            const led = document.getElementById('engine-led');
            if (maxRisk === 2) { document.body.style.setProperty('--risk-rgb', '255, 59, 92'); led.className = "w-2 h-2 bg-red-500 rounded-full animate-ping"; }
            else if (maxRisk === 1) { document.body.style.setProperty('--risk-rgb', '243, 186, 47'); led.className = "w-2 h-2 bg-yellow-500 rounded-full animate-ping"; }
            else { document.body.style.setProperty('--risk-rgb', '2, 211, 134'); led.className = "w-2 h-2 bg-green-500 rounded-full animate-ping"; }
        }

        async function fetchAIIntelligence(userQuery = null) {
            const aiContent = document.getElementById('ai-content');
            const liqList = document.getElementById('liq-list');
            try {
                const response = await fetch(AI_FUNC_PATH, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ positions: currentPositions, userMessage: userQuery })
                });
                const data = await response.json();
                
                if (data.liqZones) {
                    liqList.innerHTML = '';
                    data.liqZones.forEach(z => {
                        const color = z.side === 'short' ? '#ff3b5c' : '#02d386';
                        liqList.innerHTML += `<div class="mb-2"><div class="flex justify-between font-bold mb-1"><span>${z.side.toUpperCase()} WALL @ $${z.price}</span><span>${z.vol}</span></div><div class="progress-bg"><div class="progress-fill" style="width: ${z.intensity}%; background: ${color}"></div></div></div>`;
                    });
                }

                document.getElementById('bot-status')?.remove();
                const formatted = data.insight.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
                const newCard = document.createElement('div');
                newCard.className = 'insight-card text-white';
                aiContent.appendChild(newCard);
                
                let i = 0;
                function type() {
                    if (i < formatted.length) {
                        if (formatted.substring(i, i+4) === '<br>') { newCard.innerHTML += '<br>'; i += 4; }
                        else if (formatted.substring(i, i+8) === '<strong>') {
                            let end = formatted.indexOf('</strong>', i);
                            newCard.innerHTML += formatted.substring(i, end + 9); i = end + 9;
                        } else { newCard.innerHTML += formatted.charAt(i); i++; }
                        aiContent.scrollTop = aiContent.scrollHeight;
                        setTimeout(type, 5);
                    }
                }
                type();
                if(data.fg) document.getElementById('fg-index').innerText = `F&G: ${data.fg}`;
            } catch (err) { console.error(err); }
        }

        function updateDashboard(positions) {
            const grid = document.getElementById('dashboard-grid');
            let totalPnL = 0, totalExposure = 0, totalMargin = 0;
            positions.forEach(pos => {
                const entry = parseFloat(pos.avgPrice), current = parseFloat(pos.markPrice);
                const netPnL = parseFloat(pos.unrealisedPnl), leverage = parseFloat(pos.leverage);
                const tp = parseFloat(pos.takeProfit), liq = parseFloat(pos.liqPrice), mValue = parseFloat(pos.positionValue);
                const margin = mValue / leverage; 
                totalPnL += netPnL; totalExposure += mValue; totalMargin += margin;

                let card = document.getElementById(`card-${pos.symbol}`);
                if (!card) {
                    card = document.createElement('div');
                    card.id = `card-${pos.symbol}`;
                    card.className = `card border-l-4 ${pos.side === 'Buy' ? 'border-l-green-500' : 'border-l-red-500'}`;
                    card.innerHTML = `<div class="p-4"><div class="flex justify-between items-center mb-4"><h2 class="text-lg font-extrabold text-white uppercase">${pos.symbol} <span class="text-[9px] text-gray-500 ml-1">${leverage}x</span></h2><button onclick="handleToggle('${pos.symbol}')" class="text-gray-500">EXPANDIR</button></div><div id="metrics-${pos.symbol}" class="grid grid-cols-2 gap-y-4"></div></div><div id="chart-${pos.symbol}" class="chart-container"></div>`;
                    grid.appendChild(card);
                }
                const dLiq = liq > 0 ? Math.abs((liq - current) / current) * 100 : 100;
                const tpP = tp > 0 ? (Math.abs(current - entry) / Math.abs(tp - entry)) * 100 : 0;
                
                document.getElementById(`metrics-${pos.symbol}`).innerHTML = `
                    <div><p class="metric-label">ROE</p><p class="${netPnL >= 0 ? 'up' : 'down'} text-xl font-black">${((netPnL/margin)*100).toFixed(2)}%</p></div>
                    <div class="text-right"><p class="metric-label">PnL</p><p class="${netPnL >= 0 ? 'up' : 'down'} text-lg font-black">$${netPnL.toFixed(2)}</p></div>
                    <div class="col-span-2">
                        <div class="flex justify-between text-[9px] font-bold"><span class="${dLiq < 15 ? 'text-red-500' : 'text-gray-500'} uppercase">Dist. Liquidação</span><span>${dLiq.toFixed(1)}%</span></div>
                        <div class="progress-bg"><div class="progress-fill ${dLiq < 15 ? 'bg-red-500' : 'bg-red-900/40'}" style="width: ${Math.max(0, 100 - dLiq)}%"></div></div>
                    </div>
                    <div class="col-span-2">
                        <div class="flex justify-between text-[9px] font-bold"><span class="text-yellow-500 uppercase">Target Take Profit</span><span>${tp > 0 ? tp.toFixed(2) : '--'}</span></div>
                        <div class="progress-bg"><div class="progress-fill bg-yellow-500" style="width: ${Math.min(tpP, 100)}%"></div></div>
                    </div>`;
            });
            document.getElementById('total-pnl').innerText = `$${totalPnL.toFixed(2)}`;
            document.getElementById('total-pnl').className = `text-3xl metric-value ${totalPnL >= 0 ? 'up' : 'down'}`;
            document.getElementById('total-pnl-perc').innerText = `${totalMargin > 0 ? ((totalPnL/totalMargin)*100).toFixed(2) : 0}%`;
            document.getElementById('total-exposure').innerText = `$${totalExposure.toFixed(2)}`;
            document.getElementById('total-margin').innerText = `$${totalMargin.toFixed(2)}`;
            document.getElementById('avg-leverage').innerText = (totalExposure / totalMargin).toFixed(2) + 'x';
        }

        function handleToggle(s) { 
            const c = document.getElementById(`chart-${s}`); 
            const isV = c.classList.toggle('chart-visible');
            if (isV && !c.dataset.loaded) {
                new TradingView.widget({ 
                    "autosize": true, "symbol": `BYBIT:${s}.P`, "interval": "240", "theme": "dark", "container_id": `chart-${s}`,
                    "studies": ["Volume@tv-basicstudies"]
                });
                c.dataset.loaded = "true";
            }
        }
        function handleChat(e) { if (e.key === 'Enter') { fetchAIIntelligence(e.target.value); e.target.value = ''; } }
    </script>
</body>
</html>
