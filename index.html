<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Command Center v2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0b0e11; color: #eaecef; font-family: 'Inter', sans-serif; }
        .card { background-color: #181a20; border: 1px solid #2b3139; transition: transform 0.2s; }
        .card:hover { border-color: #4b4f56; }
        .metric-label { color: #848e9c; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .metric-value { font-family: 'Roboto Mono', monospace; font-weight: 600; }
        .pos-long { border-left: 4px solid #0ecb81; }
        .pos-short { border-left: 4px solid #f6465d; }
        .up { color: #0ecb81; }
        .down { color: #f6465d; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <div>
                <h1 class="text-2xl font-bold tracking-tight">CRYPTO COMMAND <span class="text-yellow-500">2.0</span></h1>
                <p class="text-sm text-gray-500">Live API Feed: Bybit Linear Perps</p>
            </div>
            <div class="flex gap-6">
                <div class="text-right">
                    <p class="metric-label">Total Market Value</p>
                    <p id="total-mkt" class="text-2xl metric-value">$0.00</p>
                </div>
                <div class="text-right border-l border-gray-700 pl-6">
                    <p class="metric-label">Daily P/L Total</p>
                    <p id="total-daily" class="text-2xl metric-value">$0.00</p>
                </div>
            </div>
        </header>

        <div id="dashboard-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
            </div>
    </div>

    <script>
        // Lógica de Simulação (Substituir pela chamada API Bybit)
        const positions = [
            {
                symbol: "APTUSDT",
                entry: 1.2558,
                current: 8.4200,
                qty: 3313.46,
                daily_change: 120.50,
                tp: 12.00
            }
        ];

        function renderDashboard() {
            const grid = document.getElementById('dashboard-grid');
            grid.innerHTML = '';

            positions.forEach(pos => {
                const diffAbs = pos.current - pos.entry;
                const diffRel = (diffAbs / pos.entry) * 100;
                const netPnL = diffAbs * pos.qty;
                const mktValue = pos.current * pos.qty;
                const statusClass = netPnL >= 0 ? 'up' : 'down';

                grid.innerHTML += `
                    <div class="card p-6 rounded-xl pos-long shadow-lg">
                        <div class="flex justify-between items-start mb-6">
                            <h2 class="text-xl font-bold">${pos.symbol}</h2>
                            <span class="text-xs bg-gray-800 px-2 py-1 rounded text-gray-400">PERPETUAL</span>
                        </div>

                        <div class="grid grid-cols-2 gap-y-4">
                            <div>
                                <p class="metric-label">Preço Entrada</p>
                                <p class="metric-value">$${pos.entry.toFixed(4)}</p>
                            </div>
                            <div>
                                <p class="metric-label">Preço Atual</p>
                                <p class="metric-value ${statusClass}">$${pos.current.toFixed(4)}</p>
                            </div>
                            
                            <div class="col-span-2 border-t border-gray-800 my-1"></div>

                            <div>
                                <p class="metric-label">Diferença (Abs)</p>
                                <p class="metric-value ${statusClass}">${diffAbs >= 0 ? '+' : ''}${diffAbs.toFixed(4)}</p>
                            </div>
                            <div>
                                <p class="metric-label">Diferença (%)</p>
                                <p class="metric-value ${statusClass}">${diffRel >= 0 ? '+' : ''}${diffRel.toFixed(2)}%</p>
                            </div>

                            <div>
                                <p class="metric-label">Market Value</p>
                                <p class="metric-value text-white">$${mktValue.toLocaleString(undefined, {minimumFractionDigits: 2})}</p>
                            </div>
                            <div>
                                <p class="metric-label text-yellow-500">Take Profit</p>
                                <p class="metric-value text-yellow-500">$${pos.tp.toFixed(4)}</p>
                            </div>

                            <div class="col-span-2 bg-gray-900/50 p-3 rounded-lg flex justify-between mt-2">
                                <div>
                                    <p class="metric-label">PnL Diário</p>
                                    <p class="metric-value ${pos.daily_change >= 0 ? 'up' : 'down'}">$${pos.daily_change.toFixed(2)}</p>
                                </div>
                                <div class="text-right">
                                    <p class="metric-label">PnL Líquido</p>
                                    <p class="text-lg metric-value ${statusClass}">$${netPnL.toLocaleString(undefined, {minimumFractionDigits: 2})}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        renderDashboard();
    </script>
</body>
</html>
