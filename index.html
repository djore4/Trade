<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Command Center v2.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0e11; color: #eaecef; font-family: 'Inter', sans-serif; }
        .card { background-color: #181a20; border: 1px solid #2b3139; position: relative; overflow: hidden; }
        .metric-label { color: #848e9c; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .metric-value { font-family: 'Roboto Mono', monospace; font-weight: 600; }
        .pos-long { border-left: 4px solid #0ecb81; }
        .pos-short { border-left: 4px solid #f6465d; }
        .up { color: #0ecb81; }
        .down { color: #f6465d; }
        .progress-bg { background-color: #2b3139; height: 4px; border-radius: 2px; width: 100%; margin-top: 4px; }
        .progress-fill { height: 100%; border-radius: 2px; transition: width 0.5s ease; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-white">CRYPTO COMMAND <span class="text-yellow-500">2.5</span></h1>
                <p class="text-sm text-gray-500">Advanced Risk Monitor: Bybit Perps</p>
            </div>
            <div class="text-right">
                <p class="metric-label">Total Unrealized PnL</p>
                <p id="total-pnl" class="text-3xl metric-value">$0.00</p>
            </div>
        </header>

        <div id="dashboard-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
            <div id="loading-state" class="p-10 text-center col-span-full text-gray-500 animate-pulse">A calcular métricas de risco...</div>
        </div>
    </div>

    <script>
        const PROJECT_ID = 'qjzjxtxrlofnoyaaypbu'; 
        const SUPABASE_KEY = 'sb_publishable_bRa-mZWTaf0g6sNyWL9OmQ_uvo7Ex5H';
        const FUNC_PATH = `https://${PROJECT_ID}.supabase.co/functions/v1/get-bybit-positions`;

        async function fetchPositions() {
            try {
                const response = await fetch(FUNC_PATH, {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                const result = await response.json();
                if (result.result?.list) {
                    renderDashboard(result.result.list.filter(p => parseFloat(p.size) !== 0));
                }
            } catch (err) {
                console.error(err);
            }
        }

        function renderDashboard(positions) {
            const grid = document.getElementById('dashboard-grid');
            let totalPnL = 0;
            grid.innerHTML = '';

            positions.forEach(pos => {
                const entry = parseFloat(pos.avgPrice) || 0;
                const current = parseFloat(pos.markPrice) || 0;
                const qty = Math.abs(parseFloat(pos.size)) || 0;
                const netPnL = parseFloat(pos.unrealisedPnl) || 0;
                const liq = parseFloat(pos.liqPrice) || 0;
                const leverage = parseFloat(pos.leverage) || 1;
                const tp = parseFloat(pos.takeProfit) || 0;

                // 1. CORREÇÃO DA MARGEM E ROE
                const posValue = entry * qty;
                const marginUsed = posValue / leverage;
                const roeReal = (netPnL / marginUsed) * 100;

                // 2. DISTÂNCIA PARA LIQUIDAÇÃO
                let distLiq = 0;
                if (liq > 0) {
                    distLiq = ((liq - current) / current) * 100;
                }
                const distAbs = Math.abs(distLiq);

                // 3. DISTÂNCIA PARA TAKE PROFIT
                let distTP = 0;
                if (tp > 0) {
                    distTP = Math.min(Math.abs(((tp - current) / (tp - entry)) * 100), 100);
                }

                const sideClass = pos.side === 'Buy' ? 'pos-long' : 'pos-short';
                const statusClass = netPnL >= 0 ? 'up' : 'down';
                totalPnL += netPnL;

                grid.innerHTML += `
                    <div class="card p-5 rounded-xl ${sideClass} shadow-xl border border-gray-800">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-xl font-black text-white">${pos.symbol} <span class="text-xs font-medium text-gray-500 ml-2">${leverage}x</span></h2>
                            <span class="text-[10px] bg-gray-800 px-3 py-1 rounded-full text-gray-300 border border-gray-700 font-bold">${pos.side.toUpperCase()}</span>
                        </div>

                        <div class="grid grid-cols-2 gap-y-6 gap-x-4">
                            <div>
                                <p class="metric-label">Preço Entrada / Atual</p>
                                <p class="text-xs text-gray-500">$${entry.toFixed(3)}</p>
                                <p class="metric-value ${statusClass} text-lg">$${current.toFixed(3)}</p>
                            </div>

                            <div class="text-right">
                                <p class="metric-label">ROE REAL</p>
                                <p class="metric-value ${statusClass} text-2xl">${roeReal >= 0 ? '+' : ''}${roeReal.toFixed(2)}%</p>
                            </div>

                            <div class="col-span-2">
                                <div class="flex justify-between items-end">
                                    <p class="metric-label text-red-500 font-bold">Risco de Liquidação</p>
                                    <p class="text-[10px] text-red-400 font-mono">$${liq.toFixed(3)} (${distLiq > 0 ? '+' : ''}${distLiq.toFixed(2)}%)</p>
                                </div>
                                <div class="progress-bg">
                                    <div class="progress-fill bg-red-600" style="width: ${Math.max(0, 100 - distAbs)}%"></div>
                                </div>
                            </div>

                            <div class="col-span-2">
                                <div class="flex justify-between items-end">
                                    <p class="metric-label text-yellow-500">Progresso Take Profit</p>
                                    <p class="text-[10px] text-yellow-500 font-mono">${tp > 0 ? '$'+tp.toFixed(3) : 'Sem TP'}</p>
                                </div>
                                <div class="progress-bg">
                                    <div class="progress-fill bg-yellow-500" style="width: ${tp > 0 ? distTP : 0}%"></div>
                                </div>
                            </div>

                            <div class="bg-black/30 p-3 rounded-lg border border-gray-800/50">
                                <p class="metric-label">Margem Inicial</p>
                                <p class="metric-value text-gray-300">$${marginUsed.toFixed(2)}</p>
                            </div>

                            <div class="bg-black/30 p-3 rounded-lg border border-gray-800/50 text-right">
                                <p class="metric-label">PnL Líquido</p>
                                <p class="metric-value ${statusClass}">$${netPnL.toFixed(2)}</p>
                            </div>
                        </div>
                    </div>
                `;
            });

            const totalEl = document.getElementById('total-pnl');
            totalEl.innerText = `$${totalPnL.toFixed(2)}`;
            totalEl.className = `text-3xl metric-value ${totalPnL >= 0 ? 'up' : 'down'}`;
        }

        fetchPositions();
        setInterval(fetchPositions, 10000);
    </script>
</body>
</html>
