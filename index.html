<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Trading Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background-color: #080a0c; 
            color: #f0f2f5; 
            font-family: 'Outfit', sans-serif; 
            -webkit-font-smoothing: antialiased;
        }
        .card { 
            background: rgba(24, 26, 32, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
        }
        .metric-label { color: #848e9c; font-size: 0.55rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; }
        .metric-value { font-family: 'Roboto Mono', monospace; font-weight: 700; }
        .up { color: #02d386; }
        .down { color: #ff3b5c; }
        
        .stat-box { 
            background: rgba(30, 33, 38, 0.5); 
            border: 1px solid rgba(255, 255, 255, 0.03); 
            padding: 10px; 
            border-radius: 8px;
        }

        /* Animação do Logótipo SVG */
        @keyframes pulse-neural {
            0% { opacity: 0.4; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1); }
            100% { opacity: 0.4; transform: scale(0.95); }
        }
        .neural-node { animation: pulse-neural 3s infinite ease-in-out; }
        .node-delayed { animation-delay: 1.5s; }

        /* Mobile Optimization */
        @media (max-width: 768px) {
            .layout-container { padding: 12px; gap: 16px; }
            .header-flex { flex-direction: column; align-items: flex-start !important; gap: 20px; }
            .pnl-box { width: 100%; text-align: left !important; border-top: 1px solid rgba(255,255,255,0.05); pt-4; }
            .metrics-grid { grid-template-columns: repeat(3, 1fr) !important; gap: 6px !important; }
            .stat-box { padding: 8px 4px; text-align: center; }
            .stat-box .metric-value { font-size: 0.85rem; }
            #total-pnl { font-size: 2.2rem; }
            .chart-container { height: 520px; }
        }

        .progress-bg { background-color: #2b3139; height: 5px; border-radius: 3px; width: 100%; margin-top: 4px; }
        .progress-fill { height: 100%; border-radius: 3px; transition: width 0.6s ease; }
        
        .chart-container { height: 520px; width: 100%; border-top: 1px solid rgba(255, 255, 255, 0.05); display: none; }
        .chart-visible { display: block !important; }
        
        .layout-container { display: flex; flex-direction: column; gap: 24px; max-width: 1600px; margin: 0 auto; padding: 20px; }
        
        #ai-section { 
            background: #0d0f12; 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            border-radius: 12px; 
            display: flex; 
            flex-direction: column; 
            height: 400px; 
            order: 10; 
        }
        
        .insight-card { border-left: 4px solid #f3ba2f; padding: 12px; margin-bottom: 8px; border-radius: 4px; background: rgba(243, 186, 47, 0.03); font-size: 13px; line-height: 1.6; }
        
        @media (min-width: 1280px) {
            .layout-container { flex-direction: row; align-items: flex-start; }
            #main-content { flex: 1; }
            #ai-section { width: 380px; height: calc(100vh - 40px); position: sticky; top: 20px; order: 1; }
        }
    </style>
</head>
<body>

    <div class="layout-container">
        <main id="main-content" class="w-full">
            <header class="mb-6">
                <div class="flex justify-between items-end mb-6 border-b border-gray-800/40 pb-6 header-flex">
                    <div class="flex items-center gap-4">
                        <svg width="35" height="35" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" class="mb-1">
                            <circle cx="20" cy="20" r="3" fill="#f3ba2f" class="neural-node"/>
                            <circle cx="34" cy="12" r="2" fill="#f3ba2f" fill-opacity="0.6" class="neural-node node-delayed"/>
                            <circle cx="34" cy="28" r="2" fill="#f3ba2f" fill-opacity="0.6" class="neural-node"/>
                            <circle cx="6" cy="12" r="2" fill="#f3ba2f" fill-opacity="0.6" class="neural-node"/>
                            <circle cx="6" cy="28" r="2" fill="#f3ba2f" fill-opacity="0.6" class="neural-node node-delayed"/>
                            <path d="M20 17L34 12M20 23L34 28M20 17L6 12M20 23L6 28M20 17V7M20 33V23" stroke="#f3ba2f" stroke-opacity="0.2" stroke-width="1.5"/>
                        </svg>
                        <div>
                            <h1 class="text-3xl font-extrabold text-white tracking-widest uppercase leading-none">AI TRADING LAB</h1>
                            <p id="update-timestamp" class="text-[7px] text-gray-600 font-mono tracking-widest uppercase mt-2">Initializing...</p>
                        </div>
                    </div>
                    <div class="text-right pnl-box">
                        <p class="metric-label">Net PnL Aberto</p>
                        <p id="total-pnl" class="text-3xl metric-value leading-none">$0.00</p>
                        <p id="total-pnl-perc" class="text-base metric-value mt-1">0.00%</p>
                    </div>
                </div>

                <div class="grid grid-cols-2 lg:grid-cols-3 gap-3 metrics-grid">
                    <div class="stat-box"><p class="metric-label">Exposure</p><p id="total-exposure" class="text-lg metric-value text-white">$0.00</p></div>
                    <div class="stat-box"><p class="metric-label">Margin</p><p id="total-margin" class="text-lg metric-value text-gray-400">$0.00</p></div>
                    <div class="stat-box border-yellow-500/20"><p class="metric-label text-yellow-500">Lev Real</p><p id="avg-leverage" class="text-lg metric-value text-yellow-500">0.00x</p></div>
                </div>
            </header>

            <div id="dashboard-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </main>

        <aside id="ai-section" class="p-4">
            <div class="flex justify-between items-center mb-4 border-b border-gray-800 pb-3">
                <span class="text-yellow-500 text-[10px] font-extrabold tracking-widest uppercase">Baltazar AI</span>
                <span id="fg-index" class="text-xs font-bold text-gray-500">F&G: --</span>
            </div>
            <div id="ai-content" class="flex-grow overflow-y-auto mb-4 space-y-3 pr-2 scrollbar-hide">
                <div class="insight-card text-gray-500 text-center">Syncing...</div>
            </div>
            <div class="pt-3 border-t border-gray-800">
                <input type="text" id="chat-input" placeholder="Comando..." class="w-full bg-transparent text-white p-1 outline-none text-sm" onkeypress="handleChat(event)">
            </div>
        </aside>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        const PROJECT_ID = 'qjzjxtxrlofnoyaaypbu'; 
        const SUPABASE_KEY = 'sb_publishable_bRa-mZWTaf0g6sNyWL9OmQ_uvo7Ex5H';
        const FUNC_PATH = `https://${PROJECT_ID}.supabase.co/functions/v1/get-bybit-positions`;
        const AI_FUNC_PATH = `https://${PROJECT_ID}.supabase.co/functions/v1/trade-advisor`;

        let currentPositions = [];

        window.onload = () => { fetchPositions(); setInterval(fetchPositions, 10000); };

        async function fetchPositions() {
            try {
                const response = await fetch(FUNC_PATH, { method: 'GET', headers: { 'Authorization': `Bearer ${SUPABASE_KEY}` } });
                const result = await response.json();
                if (result.result?.list) {
                    currentPositions = result.result.list.filter(p => parseFloat(p.size) !== 0);
                    updateDashboard(currentPositions);
                    const now = new Date();
                    document.getElementById('update-timestamp').innerText = `Sync: ${now.toLocaleTimeString()}`;
                }
            } catch (err) { console.error(err); }
        }

        async function fetchAIIntelligence(userQuery = null) {
            const aiContent = document.getElementById('ai-content');
            if (userQuery) aiContent.innerHTML += `<div class="insight-card border-blue-500 bg-blue-500/5 text-right">${userQuery}</div>`;
            try {
                const response = await fetch(AI_FUNC_PATH, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ positions: currentPositions, userMessage: userQuery })
                });
                const data = await response.json();
                if(!userQuery) aiContent.innerHTML = ''; 
                const formatted = data.insight.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
                aiContent.innerHTML += `<div class="insight-card text-white">${formatted}</div>`;
                aiContent.scrollTop = aiContent.scrollHeight;
            } catch (err) { console.error(err); }
        }

        function updateDashboard(positions) {
            const grid = document.getElementById('dashboard-grid');
            let totalPnL = 0, totalExposure = 0, totalMargin = 0;
            
            positions.forEach(pos => {
                const entry = parseFloat(pos.avgPrice), current = parseFloat(pos.markPrice);
                const qty = Math.abs(parseFloat(pos.size)), netPnL = parseFloat(pos.unrealisedPnl);
                const liq = parseFloat(pos.liqPrice), leverage = parseFloat(pos.leverage);
                const tp = parseFloat(pos.takeProfit), mValue = parseFloat(pos.positionValue);
                const margin = mValue / leverage; 
                totalPnL += netPnL; totalExposure += mValue; totalMargin += margin;

                let card = document.getElementById(`card-${pos.symbol}`);
                if (!card) {
                    card = document.createElement('div');
                    card.id = `card-${pos.symbol}`;
                    card.className = `card border-l-4 ${pos.side === 'Buy' ? 'border-l-green-500' : 'border-l-red-500'}`;
                    card.innerHTML = `
                        <div class="p-4">
                            <div class="flex justify-between items-center mb-4">
                                <h2 class="text-lg font-extrabold text-white tracking-tighter uppercase">${pos.symbol} <span class="text-[9px] text-gray-600 font-mono ml-1">${leverage}x</span></h2>
                                <button onclick="handleToggle('${pos.symbol}')" class="text-gray-600">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
                                </button>
                            </div>
                            <div id="metrics-${pos.symbol}" class="grid grid-cols-2 gap-y-4"></div>
                        </div><div id="chart-${pos.symbol}" class="chart-container"></div>`;
                    grid.appendChild(card);
                }

                const dLiq = liq > 0 ? ((liq - current) / current) * 100 : 0;
                let tpP = tp > 0 ? (Math.abs(current - entry) / Math.abs(tp - entry)) * 100 : 0;

                document.getElementById(`metrics-${pos.symbol}`).innerHTML = `
                    <div><p class="metric-label">ROE</p><p class="${netPnL >= 0 ? 'up' : 'down'} text-xl font-black">${((netPnL/margin)*100).toFixed(2)}%</p></div>
                    <div class="text-right"><p class="metric-label">PnL</p><p class="${netPnL >= 0 ? 'up' : 'down'} text-lg font-black">$${netPnL.toFixed(2)}</p></div>
                    <div class="col-span-2">
                        <div class="flex justify-between text-[9px] font-bold mb-1"><span class="text-red-500 uppercase italic">Liq.</span><span class="text-red-400 font-mono">$${liq.toFixed(2)} (${dLiq.toFixed(1)}%)</span></div>
                        <div class="progress-bg"><div class="progress-fill bg-red-600" style="width: ${Math.max(0, 100 - Math.abs(dLiq))}%"></div></div>
                    </div>
                    <div class="col-span-2">
                        <div class="flex justify-between text-[9px] font-bold mb-1"><span class="text-yellow-500 uppercase italic">TP</span><span class="text-yellow-500 font-mono">$${tp > 0 ? tp.toFixed(2) : '--'}</span></div>
                        <div class="progress-bg"><div class="progress-fill bg-yellow-500" style="width: ${Math.min(tpP, 100)}%"></div></div>
                    </div>`;
            });

            document.getElementById('total-pnl').innerText = `$${totalPnL.toFixed(2)}`;
            document.getElementById('total-pnl').className = `text-3xl metric-value ${totalPnL >= 0 ? 'up' : 'down'}`;
            document.getElementById('total-pnl-perc').innerText = `${totalMargin > 0 ? ((totalPnL/totalMargin)*100).toFixed(2) : 0}%`;
            document.getElementById('total-pnl-perc').className = `text-base metric-value ${totalPnL >= 0 ? 'up' : 'down'}`;
            document.getElementById('total-exposure').innerText = `$${totalExposure.toFixed(2)}`;
            document.getElementById('total-margin').innerText = `$${totalMargin.toFixed(2)}`;
            document.getElementById('avg-leverage').innerText = (totalExposure / totalMargin).toFixed(2) + 'x';
        }

        function handleToggle(s) { 
            const c = document.getElementById(`chart-${s}`); 
            const isV = c.classList.toggle('chart-visible');
            if (isV && !c.dataset.loaded) {
                new TradingView.widget({ "autosize": true, "symbol": `BYBIT:${s}.P`, "interval": "240", "theme": "dark", "style": "1", "container_id": `chart-${s}` });
                c.dataset.loaded = "true";
            }
        }
        function handleChat(e) { if (e.key === 'Enter' && e.target.value.trim() !== '') { const q = e.target.value; e.target.value = ''; fetchAIIntelligence(q); } }
    </script>
</body>
</html>
