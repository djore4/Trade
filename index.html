<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Trading Lab - v13.3 (Manual Trigger)</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --risk-rgb: 2, 211, 134; }
        body { 
            background-color: #080a0c; color: #f0f2f5; font-family: 'Outfit', sans-serif; 
            -webkit-font-smoothing: antialiased; background-image: radial-gradient(circle at top right, rgba(var(--risk-rgb), 0.15), transparent 800px);
            min-height: 100vh;
        }
        .card { background: rgba(24, 26, 32, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 12px; }
        .metric-label { color: #848e9c; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; }
        .metric-value { font-family: 'Roboto Mono', monospace; font-weight: 700; }
        .text-up { color: #02d386 !important; }
        .text-down { color: #ff3b5c !important; }
        
        .app-grid { display: grid; grid-template-columns: 1fr; gap: 20px; padding: 20px; max-width: 1800px; margin: 0 auto; }
        @media (min-width: 1280px) { .app-grid { grid-template-columns: 1fr 480px; align-items: start; } }

        .chat-container { height: 600px; display: flex; flex-direction: column; position: relative; }
        @media (min-width: 1280px) { .chat-container { height: calc(100vh - 40px); position: sticky; top: 20px; } }
        
        .msg { margin-bottom: 12px; padding: 14px; border-radius: 12px; font-size: 0.88rem; line-height: 1.6; }
        .user-msg { background: rgba(30, 144, 255, 0.15); border-right: 4px solid #1e90ff; align-self: flex-end; margin-left: auto; color: #e2e8f0; }
        .bot-msg { background: rgba(243, 186, 47, 0.05); border-left: 4px solid #f3ba2f; color: #ffffff; }

        .progress-bg { background-color: #1e2329; height: 6px; border-radius: 3px; width: 100%; margin-top: 4px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 3px; transition: width 0.8s ease; }
        
        .tv-wrap { height: 400px; margin-top: 15px; border-radius: 8px; overflow: hidden; background: #000; border: 1px solid rgba(255,255,255,0.05); }
        .hidden { display: none; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #2b3139; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="app-grid">
        <main>
            <header class="mb-8">
                <div class="flex flex-col md:flex-row justify-between gap-4 border-b border-gray-800/40 pb-6 mb-8">
                    <div>
                        <h1 class="text-4xl font-extrabold text-white tracking-tight mb-2"><span class="text-[#f3ba2f]">AI</span> Trading Lab</h1>
                        <div class="flex flex-wrap gap-2">
                            <span class="px-2 py-1 bg-white/5 rounded border border-white/10 text-[9px] font-bold text-gray-500 uppercase flex items-center gap-2">
                                <span id="status-led" class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></span> Terminal Online
                            </span>
                            <span id="macro-trend" class="px-2 py-1 bg-white/5 rounded border border-white/10 text-[9px] font-bold text-gray-400 uppercase">Tendência Macro: Aguardando Bot...</span>
                        </div>
                    </div>
                    <button onclick="fetchAIIntelligence()" class="bg-[#f3ba2f] hover:bg-yellow-400 text-black px-8 py-3 rounded-xl font-black transition-all flex justify-center items-center gap-3 shadow-[0_0_20px_rgba(243,186,47,0.3)] uppercase text-sm">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                        Analisar com Baltazar
                    </button>
                </div>

                <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-8">
                    <div class="card p-4"><p class="metric-label">PnL Global</p><p id="total-pnl" class="text-xl metric-value leading-none">$0</p></div>
                    <div class="card p-4"><p class="metric-label">ROE Médio</p><p id="total-pnl-perc" class="text-xl metric-value leading-none">0,00%</p></div>
                    <div class="card p-4"><p class="metric-label">Exposição</p><p id="total-exposure" class="text-xl metric-value text-white leading-none">$0</p></div>
                    <div class="card p-4 border-yellow-500/10"><p class="metric-label text-yellow-500">Alavancagem</p><p id="avg-leverage" class="text-xl metric-value text-yellow-500 leading-none">0,00x</p></div>
                </div>
            </header>
            <div id="dashboard-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </main>

        <aside class="card p-6 chat-container flex flex-col">
            <div class="flex justify-between items-center mb-6 border-b border-gray-800 pb-4">
                <span class="text-white text-xs font-bold tracking-widest uppercase">Baltazar Strategy Console</span>
                <span id="fg-index" class="text-[10px] font-black text-gray-500 font-mono bg-white/5 px-2 py-1 rounded">F&G: --</span>
            </div>
            <div id="ai-content" class="flex-grow overflow-y-auto pr-2 flex flex-col mb-4">
                <div class="bot-msg msg">Sistema pronto. Clica no botão superior para iniciar a análise tática.</div>
            </div>
            <div class="pt-4 border-t border-gray-800">
                <input type="text" id="chat-input" placeholder="Perguntar algo específico..." class="w-full bg-white/5 p-4 rounded-xl text-white outline-none text-sm border border-white/5 focus:border-yellow-500/30 transition-all" onkeypress="handleChat(event)">
            </div>
        </aside>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        const AI_FUNC_PATH = `https://qjzjxtxrlofnoyaaypbu.supabase.co/functions/v1/trade-advisor`;
        const FUNC_PATH = `https://qjzjxtxrlofnoyaaypbu.supabase.co/functions/v1/get-bybit-positions`;
        const SUPABASE_KEY = 'sb_publishable_bRa-mZWTaf0g6sNyWL9OmQ_uvo7Ex5H';

        let currentPositions = [];

        // Apenas telemetria Bybit é automática. Bot é MANUAL.
        window.onload = () => { fetchPositions(); setInterval(fetchPositions, 10000); };

        function formatPT(num, isMoney = false, precision = 2) {
            const val = Math.abs(num).toLocaleString('pt-PT', { minimumFractionDigits: precision, maximumFractionDigits: precision });
            return (num < 0 ? "-" : "") + (isMoney ? "$" : "") + val;
        }

        async function fetchPositions() {
            try {
                const response = await fetch(FUNC_PATH, { headers: { 'Authorization': `Bearer ${SUPABASE_KEY}` } });
                const result = await response.json();
                if (result.result?.list) {
                    currentPositions = result.result.list.filter(p => parseFloat(p.size) !== 0);
                    updateDashboard(currentPositions);
                }
            } catch (err) { console.error(err); }
        }

        function updateDashboard(positions) {
            const grid = document.getElementById('dashboard-grid');
            let totalPnL = 0, totalMargin = 0, totalExp = 0, maxRisk = 0;

            positions.forEach(pos => {
                const netPnL = parseFloat(pos.unrealisedPnl), mValue = parseFloat(pos.positionValue);
                const leverage = parseFloat(pos.leverage), current = parseFloat(pos.markPrice);
                const entry = parseFloat(pos.avgPrice), liq = parseFloat(pos.liqPrice), tp = parseFloat(pos.takeProfit);
                const margin = mValue / leverage;
                totalPnL += netPnL; totalMargin += margin; totalExp += mValue;

                let card = document.getElementById(`card-${pos.symbol}`);
                if (!card) {
                    card = document.createElement('div');
                    card.id = `card-${pos.symbol}`;
                    card.className = `card border-l-4 p-5 ${pos.side === 'Buy' ? 'border-l-green-500' : 'border-l-red-500'}`;
                    card.innerHTML = `<div class="flex justify-between items-center mb-5">
                        <h2 class="font-black text-white text-lg tracking-tighter uppercase">${pos.symbol} <span class="text-[10px] text-yellow-500 bg-yellow-500/10 px-2 py-1 rounded ml-1">${leverage}x</span></h2>
                        <button onclick="toggleChart('${pos.symbol}')" class="text-gray-500 hover:text-white"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" stroke-width="2.5" stroke-linecap="round"></path></svg></button>
                    </div><div id="m-${pos.symbol}" class="grid grid-cols-2 gap-4"></div>
                    <div id="tv-${pos.symbol}" class="tv-wrap hidden"></div>`;
                    grid.appendChild(card);
                }

                const dLiq = liq > 0 ? Math.abs((liq - current) / current) * 100 : 100;
                const tpP = tp > 0 ? (Math.abs(current - entry) / Math.abs(tp - entry)) * 100 : 0;
                const pnlClass = netPnL >= 0 ? 'text-up' : 'text-down';
                if(dLiq < 12) maxRisk = 2; else if(dLiq < 25 && maxRisk < 2) maxRisk = 1;

                document.getElementById(`m-${pos.symbol}`).innerHTML = `
                    <div><p class="metric-label">ROE</p><p class="${pnlClass} text-2xl font-black">${formatPT((netPnL/margin)*100)}%</p></div>
                    <div class="text-right"><p class="metric-label">PnL Atual</p><p class="${pnlClass} text-xl font-bold">${formatPT(netPnL, true)}</p></div>
                    
                    <div class="pt-2 border-t border-gray-800/50"><p class="metric-label">Valor Posição</p><p class="text-sm font-bold text-gray-200">${formatPT(mValue, true)}</p></div>
                    <div class="text-right pt-2 border-t border-gray-800/50"><p class="metric-label">Entrada / Mercado</p><p class="text-xs font-bold text-gray-300">${formatPT(entry, false, 4)}</p><p class="text-[10px] text-gray-500 font-mono">${formatPT(current, false, 4)}</p></div>

                    <div class="col-span-2 mt-2">
                        <div class="flex justify-between text-[9px] font-bold text-gray-500 uppercase"><span>Dist. Liquidação</span><span>${formatPT(dLiq)}%</span></div>
                        <div class="progress-bg"><div class="progress-fill ${dLiq < 12 ? 'bg-red-500' : 'bg-red-900/40'}" style="width: ${Math.max(0, 100 - dLiq)}%"></div></div>
                    </div>
                    <div class="col-span-2">
                        <div class="flex justify-between text-[9px] font-bold text-yellow-600 uppercase"><span>Take Profit (${tp})</span><span>${tpP.toFixed(0)}%</span></div>
                        <div class="progress-bg"><div class="progress-fill bg-yellow-500/60" style="width: ${Math.min(tpP, 100)}%"></div></div>
                    </div>`;
            });

            const led = document.getElementById('status-led');
            led.className = maxRisk === 2 ? "w-1.5 h-1.5 bg-red-500 rounded-full animate-ping" : (maxRisk === 1 ? "w-1.5 h-1.5 bg-yellow-500 rounded-full animate-pulse" : "w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse");

            document.getElementById('total-pnl').innerText = formatPT(totalPnL, true);
            document.getElementById('total-pnl-perc').innerText = `${formatPT(totalMargin > 0 ? (totalPnL/totalMargin*100) : 0)}%`;
            document.getElementById('total-exposure').innerText = formatPT(totalExp, true);
            document.getElementById('avg-leverage').innerText = formatPT(totalMargin > 0 ? (totalExp / totalMargin) : 0) + 'x';
        }

        async function fetchAIIntelligence(userQuery = null) {
            const aiContent = document.getElementById('ai-content');
            if (userQuery) {
                const uMsg = document.createElement('div'); uMsg.className = 'msg user-msg'; uMsg.innerText = userQuery;
                aiContent.appendChild(uMsg); aiContent.scrollTop = aiContent.scrollHeight;
            }

            try {
                const response = await fetch(AI_FUNC_PATH, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ positions: currentPositions, userMessage: userQuery })
                });
                const data = await response.json();
                if(data.fg) document.getElementById('fg-index').innerText = `F&G: ${data.fg}`;
                
                const macro = document.getElementById('macro-trend');
                const isBull = data.insight.toUpperCase().includes("BULLISH") || data.insight.toUpperCase().includes("ALTA");
                macro.innerText = isBull ? "Tendência Macro: BULLISH" : "Tendência Macro: BEARISH";
                macro.className = `px-2 py-1 rounded border text-[9px] font-bold uppercase transition-colors ${isBull ? 'bg-green-500/10 border-green-500/20 text-green-500' : 'bg-red-500/10 border-red-500/20 text-red-500'}`;

                const nMsg = document.createElement('div'); nMsg.className = 'msg bot-msg'; aiContent.appendChild(nMsg);
                const cleaned = data.insight.replace(/<\/?[^>]+(>|$)/g, (match) => ["<strong>", "</strong>", "<br>"].includes(match) ? match : "").replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
                
                let i = 0;
                function type() {
                    if (i < cleaned.length) {
                        if (cleaned.substring(i, i+4) === '<br>') { nMsg.innerHTML += '<br>'; i += 4; }
                        else if (cleaned.substring(i, i+8) === '<strong>') {
                            let end = cleaned.indexOf('</strong>', i);
                            nMsg.innerHTML += cleaned.substring(i, end + 9); i = end + 9;
                        } else { nMsg.innerHTML += cleaned.charAt(i); i++; }
                        aiContent.scrollTop = aiContent.scrollHeight;
                        setTimeout(type, 5);
                    }
                }
                type();
            } catch (err) { console.error(err); }
        }

        function toggleChart(s) {
            const el = document.getElementById(`tv-${s}`);
            const isActive = el.classList.toggle('hidden');
            if (!isActive && !el.dataset.loaded) {
                new TradingView.widget({ "autosize": true, "symbol": `BYBIT:${s}.P`, "interval": "15", "theme": "dark", "container_id": `tv-${s}`, "hide_side_toolbar": true });
                el.dataset.loaded = "true";
            }
        }

        function handleChat(e) { if (e.key === 'Enter' && e.target.value.trim() !== "") { fetchAIIntelligence(e.target.value); e.target.value = ''; } }
    </script>
</body>
</html>
