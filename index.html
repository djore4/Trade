<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Trading Lab - v20.2</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --risk-rgb: 2, 211, 134; --yellow-binance: #f3ba2f; }
        body { 
            background-color: #080a0c; color: #f0f2f5; font-family: 'Outfit', sans-serif; 
            -webkit-font-smoothing: antialiased; background-image: radial-gradient(circle at top right, rgba(var(--risk-rgb), 0.1), transparent 800px);
            min-height: 100vh;
        }
        .card { background: rgba(24, 26, 32, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 12px; }
        .metric-label { color: #848e9c; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.15em; font-weight: 700; }
        .metric-value { font-family: 'Roboto Mono', monospace; font-weight: 700; }
        
        @media (max-width: 768px) {
            .app-grid { padding: 10px; gap: 10px; }
            #ai-section { height: 60vh; position: relative; top: 0; margin-top: 20px; }
        }

        .nav-btn { font-weight: 800; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: #848e9c; border-bottom: 2px solid transparent; transition: 0.3s; }
        .nav-btn.active { color: var(--yellow-binance); border-bottom-color: var(--yellow-binance); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        select { background-color: #1e2329 !important; color: white !important; border: 1px solid rgba(255,255,255,0.1) !important; padding: 12px; border-radius: 8px; width: 100%; outline: none; }
        input[type="number"] { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: white; padding: 10px; font-family: 'Roboto Mono'; font-size: 0.9rem; width: 100%; }

        .price-line { position: relative; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; margin: 60px 20px; }
        .price-marker { position: absolute; top: -35px; transform: translateX(-50%); font-size: 9px; font-weight: 800; text-transform: uppercase; white-space: nowrap; text-align: center; }
        .price-dot { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 12px; height: 12px; border-radius: 50%; border: 2px solid #080a0c; z-index: 10; }

        .app-grid { display: grid; grid-template-columns: 1fr; gap: 20px; padding: 20px; max-width: 1800px; margin: 0 auto; transition: all 0.4s ease; }
        @media (min-width: 1280px) { .app-grid.chat-open { grid-template-columns: 1fr 450px; } #ai-section { height: calc(100vh - 140px); position: sticky; top: 110px; } }
        
        .bot-msg { background: rgba(243, 186, 47, 0.03); border-left: 4px solid var(--yellow-binance); }
        .tv-wrap { height: 400px; margin-top: 15px; border-radius: 12px; overflow: hidden; background: #000; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header class="border-b border-gray-800/40 bg-[#080a0c]/90 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-[1800px] mx-auto px-4 md:px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-4 md:gap-8">
                <h1 class="text-xl md:text-2xl font-black text-white"><span class="text-[#f3ba2f]">AI</span> Lab</h1>
                <nav class="flex gap-4">
                    <button onclick="switchTab('dashboard')" id="btn-dashboard" class="nav-btn active">Dash</button>
                    <button onclick="switchTab('simulator')" id="btn-simulator" class="nav-btn">Sim</button>
                </nav>
            </div>
            <div class="flex items-center gap-4">
                <div class="hidden md:flex gap-4 text-[9px] font-bold text-gray-500 uppercase">
                    <span id="macro-trend">Macro: --</span>
                    <span id="fg-index-top">F&G: --</span>
                </div>
                <button onclick="handleBaltazarCall()" class="bg-[#f3ba2f] text-black px-4 py-2 rounded-lg font-black uppercase text-[10px]">Baltazar</button>
            </div>
        </div>
    </header>

    <div id="main-grid" class="app-grid">
        <main>
            <section id="tab-dashboard" class="tab-content active">
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
                    <div class="card p-4"><p class="metric-label">PnL Global</p><p id="total-pnl" class="metric-value">$0</p></div>
                    <div class="card p-4"><p class="metric-label">ROE Médio</p><p id="total-pnl-perc" class="metric-value">0%</p></div>
                    <div class="card p-4 hidden md:block"><p class="metric-label">Exposição</p><p id="total-exposure" class="metric-value">$0</p></div>
                    <div class="card p-4"><p class="metric-label text-yellow-500">Lev. Real</p><p id="avg-leverage" class="metric-value text-yellow-500">0x</p></div>
                </div>
                <div id="dashboard-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </section>

            <section id="tab-simulator" class="tab-content">
                <div class="card p-4 md:p-8">
                    <div class="mb-6">
                        <label class="metric-label block mb-2">Posição Ativa</label>
                        <select id="sim-select-pos" onchange="loadPositionToSim()"></select>
                    </div>

                    <div class="mb-16 overflow-x-auto">
                        <div id="price-map" class="price-line"></div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div class="lg:col-span-2 overflow-x-auto">
                            <table class="w-full text-[11px]">
                                <thead class="text-gray-500 uppercase border-b border-gray-800">
                                    <tr><th class="pb-2 text-left">Valor (USD)</th><th class="pb-2 text-left">Preço</th><th class="pb-2 text-center">On</th></tr>
                                </thead>
                                <tbody id="sim-slots-body"></tbody>
                            </table>
                        </div>
                        <div class="card bg-white/5 p-5 border-l-4 border-l-[#f3ba2f]">
                            <h3 class="metric-label mb-4 text-white">Impacto Estimado</h3>
                            <div class="mb-4"><p class="metric-label">Preço Atual</p><p id="sim-ref-price" class="text-lg font-bold">0.0000</p></div>
                            <div class="mb-4"><p class="metric-label">Novo Médio</p><p id="res-new-avg" class="text-3xl font-black text-[#02d386]">---</p></div>
                            <div class="pt-4 border-t border-gray-800 space-y-2">
                                <div class="flex justify-between"><span class="metric-label">Custo DCA</span><span id="res-total-cost" class="font-bold">$0.00</span></div>
                                <div class="flex justify-between"><span class="metric-label">Aproximação</span><span id="res-dist-text" class="text-[#02d386] font-bold">0%</span></div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <aside id="ai-section" class="card p-6 flex flex-col">
            <div class="flex justify-between mb-4 border-b border-gray-800 pb-3">
                <span class="text-white text-[10px] font-black uppercase tracking-widest text-yellow-500/80">Baltazar</span>
                <span id="ai-loading" class="text-[9px] text-yellow-500 animate-pulse hidden uppercase">Analisando</span>
            </div>
            <div id="ai-content" class="flex-grow overflow-y-auto mb-4 text-sm flex flex-col scrollbar-hide"></div>
            <input type="text" id="chat-input" placeholder="Comando..." class="w-full bg-white/5 p-4 rounded-xl text-white outline-none text-xs border border-white/5 focus:border-[#f3ba2f]" onkeypress="handleChat(event)">
        </aside>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        const FUNC_PATH = `https://qjzjxtxrlofnoyaaypbu.supabase.co/functions/v1/get-bybit-positions`;
        const AI_FUNC_PATH = `https://qjzjxtxrlofnoyaaypbu.supabase.co/functions/v1/trade-advisor`;
        const SUPABASE_KEY = 'sb_publishable_bRa-mZWTaf0g6sNyWL9OmQ_uvo7Ex5H';
        let currentPositions = [];

        window.onload = () => { generateSimSlots(); fetchPositions(); setInterval(fetchPositions, 10000); fetchTelemetry(); };

        function switchTab(t) {
            document.querySelectorAll('.tab-content, .nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + t).classList.add('active');
            document.getElementById('btn-' + t).classList.add('active');
        }

        function fPT(n, isM = false, p = 2) {
            const dec = isM ? 2 : p;
            return (isM ? "$" : "") + n.toLocaleString('pt-PT', { minimumFractionDigits: dec, maximumFractionDigits: dec });
        }

        async function fetchPositions() {
            try {
                const r = await fetch(FUNC_PATH, { headers: { 'Authorization': `Bearer ${SUPABASE_KEY}` } });
                const d = await r.json();
                if (d.result?.list) {
                    currentPositions = d.result.list.filter(p => parseFloat(p.size) !== 0);
                    updateDashboard(currentPositions);
                    updateSimDropdown(currentPositions);
                    runSimulation();
                }
            } catch (e) {}
        }

        function updateDashboard(positions) {
            const grid = document.getElementById('dashboard-grid');
            let tPnL = 0, tMarg = 0, tExp = 0;
            positions.forEach(pos => {
                const pnl = parseFloat(pos.unrealisedPnl), val = parseFloat(pos.positionValue);
                const lev = parseFloat(pos.leverage), cur = parseFloat(pos.markPrice);
                const ent = parseFloat(pos.avgPrice), liq = parseFloat(pos.liqPrice), marg = val / lev;
                tPnL += pnl; tMarg += marg; tExp += val;
                
                let card = document.getElementById(`card-${pos.symbol}`);
                if (!card) {
                    card = document.createElement('div'); card.id = `card-${pos.symbol}`;
                    card.className = `card border-l-4 p-4 ${pos.side === 'Buy' ? 'border-l-green-500' : 'border-l-red-500'}`;
                    card.innerHTML = `<div class="content-area"></div><div id="tv-${pos.symbol}" class="tv-wrap hidden"></div>`;
                    grid.appendChild(card);
                }
                const dLiq = liq > 0 ? Math.abs((liq - cur) / cur) * 100 : 100;
                card.querySelector('.content-area').innerHTML = `
                    <div class="flex justify-between mb-4"><h2 class="font-black text-sm uppercase">${pos.symbol}</h2><button onclick="handleUniversalToggle('${pos.symbol}')" class="text-gray-500">Gráfico</button></div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><p class="metric-label">ROE</p><p class="font-black ${pnl >= 0 ? 'text-green-500' : 'text-red-500'}">${((pnl/marg)*100).toFixed(2)}%</p></div>
                        <div class="text-right"><p class="metric-label">PnL</p><p class="font-bold ${pnl >= 0 ? 'text-green-500' : 'text-red-500'}">${fPT(pnl, true)}</p></div>
                        <div class="col-span-2"><div class="progress-bg"><div class="progress-fill ${dLiq < 10 ? 'bg-red-500' : 'bg-green-500/30'}" style="width: ${Math.max(0, 100 - dLiq)}%"></div></div></div>
                    </div>`;
            });
            document.getElementById('total-pnl').innerText = fPT(tPnL, true);
            document.getElementById('total-pnl-perc').innerText = (tMarg > 0 ? (tPnL/tMarg*100) : 0).toFixed(2) + "%";
            document.getElementById('total-exposure').innerText = fPT(tExp, true);
            document.getElementById('avg-leverage').innerText = (tMarg > 0 ? (tExp / tMarg) : 0).toFixed(2) + "x";
        }

        function generateSimSlots() {
            const b = document.getElementById('sim-slots-body');
            for(let i=0; i<10; i++) {
                const r = document.createElement('tr');
                r.innerHTML = `<td><input type="number" class="sim-input-val" oninput="runSimulation()"></td><td class="px-1"><input type="number" class="sim-input-price" oninput="runSimulation()"></td><td class="text-center"><input type="checkbox" checked class="sim-checkbox" onchange="runSimulation()"></td>`;
                b.appendChild(r);
            }
        }

        function updateSimDropdown(positions) {
            const s = document.getElementById('sim-select-pos');
            const v = s.value; s.innerHTML = '<option value="">Selecionar...</option>';
            positions.forEach(p => { const o = document.createElement('option'); o.value = p.symbol; o.innerText = p.symbol; s.appendChild(o); });
            if(v) s.value = v;
        }

        function loadPositionToSim() {
            const sym = document.getElementById('sim-select-pos').value;
            const p = currentPositions.find(x => x.symbol === sym);
            if(p) { document.getElementById('sim-ref-price').innerText = parseFloat(p.markPrice).toFixed(4); runSimulation(); }
        }

        function runSimulation() {
            const sym = document.getElementById('sim-select-pos').value;
            const p = currentPositions.find(x => x.symbol === sym);
            if(!p) return;

            let curQty = Math.abs(parseFloat(p.size)), curAvg = parseFloat(p.avgPrice), mkPrice = parseFloat(p.markPrice);
            let totalQty = curQty, totalWPrice = curQty * curAvg, totalCost = 0;

            document.querySelectorAll('.sim-input-val').forEach((v, i) => {
                const pr = document.querySelectorAll('.sim-input-price')[i], ch = document.querySelectorAll('.sim-checkbox')[i];
                if(ch.checked && v.value && pr.value) {
                    const usd = parseFloat(v.value), price = parseFloat(pr.value);
                    const qty = usd / price; totalQty += qty; totalWPrice += (qty * price); totalCost += usd;
                }
            });

            const nAvg = totalWPrice / totalQty;
            document.getElementById('res-new-avg').innerText = nAvg.toFixed(4);
            document.getElementById('res-total-cost').innerText = fPT(totalCost, true);
            
            const oldD = Math.abs(curAvg - mkPrice), newD = Math.abs(nAvg - mkPrice);
            document.getElementById('res-dist-text').innerText = oldD > 0 ? (((oldD - newD)/oldD)*100).toFixed(1) + "%" : "0%";
            renderPriceMap(mkPrice, curAvg, nAvg, parseFloat(p.liqPrice), parseFloat(p.takeProfit));
        }

        function renderPriceMap(mark, oldAvg, nAvg, liq, tp) {
            const map = document.getElementById('price-map');
            const prices = [mark, oldAvg, nAvg, liq, tp].filter(x => x > 0);
            const min = Math.min(...prices) * 0.98, max = Math.max(...prices) * 1.02, range = max - min;
            map.innerHTML = '';
            const addPoint = (val, label, color) => {
                if(!val || val <= 0) return;
                const x = ((val - min) / range) * 100;
                map.innerHTML += `<div class="price-marker" style="left: ${x}%; color: ${color}">${label}<br>${val.toFixed(4)}</div><div class="price-dot" style="left: ${x}%; background: ${color}"></div>`;
            };
            addPoint(liq, 'LIQ', '#ff3b5c'); addPoint(oldAvg, 'ENTRADA', '#848e9c'); addPoint(nAvg, 'DCA', '#02d386'); addPoint(mark, 'MARK', '#f3ba2f'); addPoint(tp, 'TP', '#02d386');
        }

        async function fetchTelemetry() {
            try {
                const r = await fetch(AI_FUNC_PATH, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ positions: currentPositions, userMessage: "TELEMETRY" }) });
                const d = await r.json();
                document.getElementById('macro-trend').innerText = `Macro: ${d.insight.toUpperCase().includes('BULLISH') ? 'BULLISH' : 'BEARISH'}`;
                document.getElementById('fg-index-top').innerText = `F&G: ${d.fg || '--'}`;
            } catch (e) {}
        }

        function handleBaltazarCall() { document.getElementById('ai-section').classList.toggle('open'); document.getElementById('main-grid').classList.toggle('chat-open'); }

        async function fetchAIIntelligence(userQuery = null) {
            const aiContent = document.getElementById('ai-content');
            const loader = document.getElementById('ai-loading');
            if (userQuery) { aiContent.innerHTML += `<div class="user-msg self-end bg-white/10 p-2 rounded-lg mb-2">${userQuery}</div>`; }
            loader.classList.remove('hidden');
            try {
                const r = await fetch(AI_FUNC_PATH, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ positions: currentPositions, userMessage: userQuery }) });
                const d = await r.json();
                aiContent.innerHTML += `<div class="bot-msg p-3 rounded-lg mb-2">${d.insight.replace(/\n/g, '<br>')}</div>`;
                aiContent.scrollTop = aiContent.scrollHeight;
            } catch (err) {} finally { loader.classList.add('hidden'); }
        }
        function handleChat(e) { if (e.key === 'Enter' && e.target.value.trim() !== "") { fetchAIIntelligence(e.target.value); e.target.value = ''; } }
        function handleUniversalToggle(s) {
            const el = document.getElementById(`tv-${s}`); el.classList.toggle('hidden');
            if(!el.classList.contains('hidden')) { new TradingView.widget({ "autosize": true, "symbol": `BYBIT:${s}.P`, "interval": "15", "theme": "dark", "container_id": `tv-${s}`, "hide_side_toolbar": true, "library_path": "https://s3.tradingview.com/tv.js" }); }
        }
    </script>
</body>
</html>
