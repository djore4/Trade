<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Trading Lab - v12.3</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --risk-rgb: 2, 211, 134; }
        body { 
            background-color: #080a0c; color: #f0f2f5; font-family: 'Outfit', sans-serif; 
            -webkit-font-smoothing: antialiased; background-image: radial-gradient(circle at top right, rgba(var(--risk-rgb), 0.15), transparent 800px);
            min-height: 100vh; overflow-x: hidden;
        }
        .card { background: rgba(24, 26, 32, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 12px; }
        .metric-label { color: #848e9c; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; }
        .metric-value { font-family: 'Roboto Mono', monospace; font-weight: 700; }
        .text-up { color: #02d386 !important; }
        .text-down { color: #ff3b5c !important; }
        
        /* Drawer Chat Mobile & Desktop */
        #ai-section { 
            position: fixed; right: -100%; top: 0; width: 100%; max-width: 500px; height: 100vh; 
            transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 100;
            box-shadow: -20px 0 50px rgba(0,0,0,0.9); background: #0c0e12;
        }
        #ai-section.open { right: 0; }
        
        /* Balões de Chat */
        .msg { margin-bottom: 12px; padding: 12px 16px; border-radius: 12px; font-size: 0.9rem; line-height: 1.6; position: relative; }
        .user-msg { 
            background: rgba(30, 144, 255, 0.1); border-right: 4px solid #1e90ff; 
            align-self: flex-end; margin-left: auto; color: #e2e8f0; 
        }
        .bot-msg { 
            background: rgba(243, 186, 47, 0.05); border-left: 4px solid #f3ba2f; 
            color: #ffffff; align-self: flex-start;
        }

        .layout-container { max-width: 1600px; margin: 0 auto; padding: 15px; transition: opacity 0.4s ease; }
        .layout-container.shifted { opacity: 0.3; pointer-events: none; }

        .progress-bg { background-color: #1e2329; height: 6px; border-radius: 3px; width: 100%; margin-top: 4px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 3px; transition: width 0.8s ease; }

        @media (max-width: 640px) {
            .text-5xl { font-size: 2.5rem; }
            .stat-box { padding: 8px; }
            .metric-value { font-size: 1rem; }
            #ai-section { max-width: 100%; }
        }
    </style>
</head>
<body>
    <div id="main-wrapper" class="layout-container">
        <header class="mb-6 md:mb-10">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-8 border-b border-gray-800/40 pb-6">
                <div>
                    <h1 class="text-4xl md:text-5xl font-extrabold text-white tracking-tight mb-2">
                        <span class="text-[#f3ba2f] drop-shadow-[0_0_15px_rgba(243,186,47,0.4)]">AI</span> Trading Lab
                    </h1>
                    <div id="macro-trend" class="text-[10px] font-bold px-2 py-1 bg-white/5 rounded border border-white/10 text-gray-500 inline-block">MACRO: SYNC...</div>
                </div>
                <button onclick="toggleAI()" class="w-full md:w-auto bg-[#f3ba2f] hover:bg-yellow-400 text-black px-8 py-3 rounded-xl font-black transition-all flex justify-center items-center gap-3">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    BALTAZAR AI
                </button>
            </div>

            <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 md:gap-4">
                <div class="stat-box card p-4"><p class="metric-label">PnL Global</p><p id="total-pnl" class="text-xl metric-value">$0</p></div>
                <div class="stat-box card p-4"><p class="metric-label">ROE Avg</p><p id="total-pnl-perc" class="text-xl metric-value">0,00%</p></div>
                <div class="stat-box card p-4"><p class="metric-label">Exposição</p><p id="total-exposure" class="text-xl metric-value text-white">$0</p></div>
                <div class="stat-box card p-4 border-yellow-500/20"><p class="metric-label text-yellow-500">Alavancagem</p><p id="avg-leverage" class="text-xl metric-value text-yellow-500">0,00x</p></div>
            </div>
        </header>
        <div id="dashboard-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4 md:gap-6"></div>
    </div>

    <aside id="ai-section" class="card p-6 flex flex-col">
        <div class="flex justify-between items-center mb-6 border-b border-gray-800 pb-4">
            <span class="text-white text-xs font-bold uppercase tracking-widest">Baltazar Strategist v2.0</span>
            <button onclick="toggleAI()" class="text-gray-500 text-2xl">&times;</button>
        </div>
        <div id="ai-content" class="flex-grow overflow-y-auto pr-2 flex flex-col scrollbar-hide"></div>
        <div class="pt-4 border-t border-gray-800">
            <input type="text" id="chat-input" placeholder="Comando..." class="w-full bg-white/5 p-4 rounded-xl text-white outline-none text-sm border border-white/5 focus:border-yellow-500/50" onkeypress="handleChat(event)">
        </div>
    </aside>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        const AI_FUNC_PATH = `https://qjzjxtxrlofnoyaaypbu.supabase.co/functions/v1/trade-advisor`;
        const FUNC_PATH = `https://qjzjxtxrlofnoyaaypbu.supabase.co/functions/v1/get-bybit-positions`;
        const SUPABASE_KEY = 'sb_publishable_bRa-mZWTaf0g6sNyWL9OmQ_uvo7Ex5H';

        let currentPositions = [];

        window.onload = () => { fetchPositions(); setInterval(fetchPositions, 10000); };

        function toggleAI() {
            document.getElementById('ai-section').classList.toggle('open');
            document.getElementById('main-wrapper').classList.toggle('shifted');
            if(document.getElementById('ai-section').classList.contains('open') && currentPositions.length > 0) fetchAIIntelligence();
        }

        async function fetchPositions() {
            try {
                const response = await fetch(FUNC_PATH, { headers: { 'Authorization': `Bearer ${SUPABASE_KEY}` } });
                const result = await response.json();
                if (result.result?.list) {
                    currentPositions = result.result.list.filter(p => parseFloat(p.size) !== 0);
                    updateDashboard(currentPositions);
                }
            } catch (err) { console.error(err); }
        }

        function updateDashboard(positions) {
            const grid = document.getElementById('dashboard-grid');
            let totalPnL = 0, totalMargin = 0, totalExp = 0;

            positions.forEach(pos => {
                const netPnL = parseFloat(pos.unrealisedPnl), mValue = parseFloat(pos.positionValue);
                const leverage = parseFloat(pos.leverage), current = parseFloat(pos.markPrice);
                const liq = parseFloat(pos.liqPrice), tp = parseFloat(pos.takeProfit);
                const margin = mValue / leverage;
                totalPnL += netPnL; totalMargin += margin; totalExp += mValue;

                let card = document.getElementById(`card-${pos.symbol}`);
                if (!card) {
                    card = document.createElement('div');
                    card.id = `card-${pos.symbol}`;
                    card.className = `card border-l-4 p-4 ${pos.side === 'Buy' ? 'border-l-green-500' : 'border-l-red-500'}`;
                    card.innerHTML = `<div class="flex justify-between mb-4">
                        <h2 class="font-black text-white text-lg">${pos.symbol} <span class="text-[10px] text-yellow-500 ml-1">${leverage}x</span></h2>
                        <button onclick="handleToggleChart('${pos.symbol}')" class="text-gray-500"><svg id="arr-${pos.symbol}" class="w-5 h-5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7" stroke-width="3"></path></svg></button>
                    </div><div id="m-${pos.symbol}" class="grid grid-cols-2 gap-4"></div>
                    <div id="c-${pos.symbol}" class="hidden h-[300px] mt-4 rounded overflow-hidden"></div>`;
                    grid.appendChild(card);
                }

                const dLiq = liq > 0 ? Math.abs((liq - current) / current) * 100 : 100;
                const pnlClass = netPnL >= 0 ? 'text-up' : 'text-down';

                document.getElementById(`m-${pos.symbol}`).innerHTML = `
                    <div><p class="metric-label">ROE</p><p class="${pnlClass} text-xl font-black">${(netPnL/margin*100).toFixed(2)}%</p></div>
                    <div class="text-right"><p class="metric-label">PnL</p><p class="${pnlClass} text-lg font-bold">$${Math.floor(netPnL)}</p></div>
                    <div class="col-span-2">
                        <div class="flex justify-between text-[9px] font-bold text-gray-500 uppercase"><span>Liq. Dist.</span><span>${dLiq.toFixed(2)}%</span></div>
                        <div class="progress-bg"><div class="progress-fill ${dLiq < 12 ? 'bg-red-500' : 'bg-red-900/40'}" style="width: ${Math.max(0, 100 - dLiq)}%"></div></div>
                    </div>`;
            });

            document.getElementById('total-pnl').innerText = `$${Math.floor(totalPnL)}`;
            document.getElementById('total-pnl').className = `text-xl metric-value ${totalPnL >= 0 ? 'text-up' : 'text-down'}`;
            document.getElementById('total-pnl-perc').innerText = `${(totalMargin > 0 ? (totalPnL/totalMargin*100) : 0).toFixed(2)}%`;
            document.getElementById('total-pnl-perc').className = `text-xl metric-value ${totalPnL >= 0 ? 'text-up' : 'text-down'}`;
            document.getElementById('total-exposure').innerText = `$${Math.floor(totalExp)}`;
            document.getElementById('avg-leverage').innerText = (totalMargin > 0 ? (totalExp / totalMargin) : 0).toFixed(2) + 'x';
        }

        async function fetchAIIntelligence(userQuery = null) {
            const aiContent = document.getElementById('ai-content');
            if (userQuery) {
                const uMsg = document.createElement('div'); uMsg.className = 'msg user-msg'; uMsg.innerText = userQuery;
                aiContent.appendChild(uMsg); aiContent.scrollTop = aiContent.scrollHeight;
            }

            try {
                const response = await fetch(AI_FUNC_PATH, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ positions: currentPositions, userMessage: userQuery })
                });
                const data = await response.json();
                
                const nMsg = document.createElement('div'); nMsg.className = 'msg bot-msg'; aiContent.appendChild(nMsg);
                
                // LIMPADEZA DE HTML INDESEJADO DO GEMINI
                let cleaned = data.insight
                    .replace(/<\/?[^>]+(>|$)/g, (match) => ["<strong>", "</strong>", "<br>", "<br/>"].includes(match) ? match : "")
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\n/g, '<br>');

                let i = 0;
                function type() {
                    if (i < cleaned.length) {
                        if (cleaned.substring(i, i+4) === '<br>') { nMsg.innerHTML += '<br>'; i += 4; }
                        else if (cleaned.substring(i, i+8) === '<strong>') {
                            let end = cleaned.indexOf('</strong>', i);
                            nMsg.innerHTML += cleaned.substring(i, end + 9); i = end + 9;
                        } else { nMsg.innerHTML += cleaned.charAt(i); i++; }
                        aiContent.scrollTop = aiContent.scrollHeight;
                        setTimeout(type, 5);
                    }
                }
                type();
            } catch (err) { console.error(err); }
        }

        function handleToggleChart(s) {
            const c = document.getElementById(`c-${s}`);
            const a = document.getElementById(`arr-${s}`);
            c.classList.toggle('hidden');
            a.classList.toggle('rotate-180');
            if(!c.classList.contains('hidden') && !c.dataset.loaded) {
                new TradingView.widget({ "autosize": true, "symbol": `BYBIT:${s}.P`, "interval": "15", "theme": "dark", "container_id": `c-${s}`, "hide_side_toolbar": true });
                c.dataset.loaded = "true";
            }
        }

        function handleChat(e) { if (e.key === 'Enter' && e.target.value.trim() !== "") { fetchAIIntelligence(e.target.value); e.target.value = ''; } }
    </script>
</body>
</html>
