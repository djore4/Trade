<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade Desk</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:       #0c0c0f;
            --surface:  #141418;
            --line:     #1e1e24;
            --muted:    #4a4a5a;
            --dim:      #8888a0;
            --text:     #e8e8f0;
            --green:    #34d399;
            --red:      #f87171;
            --btc:      #f7931a;
            --blue:     #60a5fa;
        }

        html, body { height: 100%; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }

        /* ── LAYOUT ── */
        .shell {
            display: grid;
            grid-template-rows: 48px 1fr;
            height: 100vh;
            overflow: hidden;
        }

        /* ── HEADER ── */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            border-bottom: 1px solid var(--line);
            background: var(--bg);
            gap: 24px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .wordmark {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            letter-spacing: -0.01em;
        }
        .wordmark span { color: var(--btc); }

        .header-divider {
            width: 1px;
            height: 16px;
            background: var(--line);
        }

        .ticker {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .ticker-label {
            font-size: 10px;
            font-weight: 500;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .ticker-price {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 500;
            color: var(--text);
            transition: color 0.4s;
        }
        .ticker-change {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 400;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .status-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 6px var(--green);
            flex-shrink: 0;
        }
        .status-dot.stale { background: var(--muted); box-shadow: none; }

        .header-stat {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .header-stat-label {
            font-size: 10px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .header-stat-val {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--text);
        }

        .last-updated {
            font-size: 10px;
            color: var(--muted);
            font-family: 'JetBrains Mono', monospace;
        }

        /* ── MAIN ── */
        main {
            display: grid;
            grid-template-columns: 1fr 380px;
            overflow: hidden;
        }

        @media (max-width: 900px) {
            main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
            .shell { grid-template-rows: 48px 1fr; }
        }

        /* ── PORTFOLIO PANEL ── */
        .portfolio-panel {
            overflow-y: auto;
            border-right: 1px solid var(--line);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* ── SECTION TITLES ── */
        .section-title {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--muted);
            margin-bottom: 14px;
        }

        /* ── KPI ROW ── */
        .kpi-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1px;
            background: var(--line);
            border: 1px solid var(--line);
            border-radius: 8px;
            overflow: hidden;
        }

        @media (max-width: 640px) { .kpi-row { grid-template-columns: repeat(2, 1fr); } }

        .kpi {
            background: var(--surface);
            padding: 16px 18px;
        }
        .kpi-label {
            font-size: 10px;
            font-weight: 500;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 8px;
        }
        .kpi-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 20px;
            font-weight: 500;
            color: var(--text);
            line-height: 1;
        }
        .kpi-sub {
            font-size: 10px;
            color: var(--muted);
            margin-top: 4px;
            font-family: 'JetBrains Mono', monospace;
        }

        /* ── POSITION CARDS ── */
        .positions-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .pos-card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 8px;
            overflow: hidden;
        }

        .pos-header {
            display: grid;
            grid-template-columns: auto 1fr auto auto;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--line);
        }

        .pos-side-bar {
            width: 3px;
            height: 32px;
            border-radius: 2px;
            flex-shrink: 0;
        }
        .long { background: var(--green); }
        .short { background: var(--red); }

        .pos-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            letter-spacing: -0.01em;
        }
        .pos-tags {
            display: flex;
            gap: 4px;
            margin-top: 3px;
        }
        .tag {
            font-size: 9px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 2px 5px;
            border-radius: 3px;
        }
        .tag-long  { background: rgba(52,211,153,0.1); color: var(--green); }
        .tag-short { background: rgba(248,113,113,0.1); color: var(--red); }
        .tag-lev   { background: rgba(247,147,26,0.1); color: var(--btc); }
        .tag-inv   { background: rgba(96,165,250,0.1); color: var(--blue); }
        .tag-lin   { background: rgba(148,163,184,0.1); color: var(--dim); }

        .pos-roe {
            text-align: right;
        }
        .roe-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 18px;
            font-weight: 500;
            line-height: 1;
        }
        .roe-label { font-size: 9px; color: var(--muted); margin-top: 3px; text-transform: uppercase; letter-spacing: 0.08em; }

        .pos-pnl {
            text-align: right;
        }
        .pnl-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 15px;
            font-weight: 500;
            line-height: 1;
        }
        .pnl-label { font-size: 9px; color: var(--muted); margin-top: 3px; text-transform: uppercase; letter-spacing: 0.08em; }

        .pos-body {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1px;
            background: var(--line);
        }
        @media (max-width: 540px) { .pos-body { grid-template-columns: repeat(2, 1fr); } }

        .pos-field {
            background: var(--bg);
            padding: 10px 14px;
        }
        .pos-field-label {
            font-size: 9px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
            margin-bottom: 5px;
        }
        .pos-field-val {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--text);
        }
        .pos-field-val.green { color: var(--green); }
        .pos-field-val.red   { color: var(--red); }
        .pos-field-val.btc   { color: var(--btc); }

        /* Distance bar */
        .pos-footer {
            padding: 10px 16px;
            background: var(--bg);
            border-top: 1px solid var(--line);
        }
        .dist-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .dist-label {
            font-size: 9px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
        }
        .dist-pct {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--dim);
        }
        .bar-track {
            height: 3px;
            background: var(--line);
            border-radius: 2px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.6s ease;
        }

        /* ── NO POSITIONS ── */
        .empty-state {
            padding: 48px 24px;
            text-align: center;
            color: var(--muted);
            font-size: 12px;
        }

        /* ── NEWS PANEL ── */
        .news-panel {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .news-header {
            padding: 16px 20px 14px;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .news-tabs {
            display: flex;
            gap: 0;
        }
        .news-tab {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
            padding: 4px 10px;
            cursor: pointer;
            border-radius: 4px;
            transition: color 0.15s, background 0.15s;
        }
        .news-tab.active {
            color: var(--text);
            background: var(--line);
        }

        .news-refresh {
            width: 24px; height: 24px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 4px;
            cursor: pointer;
            color: var(--muted);
            transition: color 0.15s, background 0.15s;
            font-size: 14px;
            border: none;
            background: transparent;
        }
        .news-refresh:hover { color: var(--text); background: var(--line); }
        .news-refresh.spinning { animation: spin 0.7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .news-feed {
            overflow-y: auto;
            flex: 1;
        }

        .news-item {
            padding: 14px 20px;
            border-bottom: 1px solid var(--line);
            cursor: pointer;
            transition: background 0.1s;
        }
        .news-item:hover { background: var(--surface); }
        .news-item:last-child { border-bottom: none; }

        .news-source-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
        }
        .news-source {
            font-size: 9px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--btc);
        }
        .news-dot { width: 2px; height: 2px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
        .news-time {
            font-size: 9px;
            color: var(--muted);
            font-family: 'JetBrains Mono', monospace;
        }

        .news-title {
            font-size: 12px;
            font-weight: 500;
            color: var(--text);
            line-height: 1.55;
        }

        .news-loading {
            padding: 40px 20px;
            text-align: center;
            color: var(--muted);
            font-size: 11px;
        }

        /* ── SCROLLBAR ── */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 2px; }

        /* ── PULSE ANIMATION ── */
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
        .pulse { animation: pulse 1.5s ease-in-out infinite; }

        /* ── UP/DOWN FLASH ── */
        .flash-up   { color: var(--green) !important; }
        .flash-down { color: var(--red) !important; }
    </style>
</head>
<body>

<div class="shell">

    <!-- ══ HEADER ══ -->
    <header>
        <div class="header-left">
            <div class="wordmark"><span>₿</span> Trade Desk</div>
            <div class="header-divider"></div>
            <div class="ticker">
                <span class="ticker-label">BTC</span>
                <span id="hdr-price" class="ticker-price mono">—</span>
                <span id="hdr-change" class="ticker-change mono" style="color:var(--muted)">—</span>
            </div>
            <div class="header-divider"></div>
            <div class="header-stat">
                <span class="header-stat-label">Fund</span>
                <span id="hdr-fund" class="header-stat-val">—</span>
            </div>
        </div>
        <div class="header-right">
            <span id="hdr-updated" class="last-updated">—</span>
            <div id="live-dot" class="status-dot stale"></div>
        </div>
    </header>

    <!-- ══ MAIN ══ -->
    <main>

        <!-- ── LEFT: Portfolio ── -->
        <div class="portfolio-panel">

            <!-- KPIs -->
            <div>
                <div class="section-title">Carteira</div>
                <div class="kpi-row">
                    <div class="kpi">
                        <div class="kpi-label">PnL Aberto</div>
                        <div id="kpi-pnl" class="kpi-value">—</div>
                        <div id="kpi-roe" class="kpi-sub">ROE —</div>
                    </div>
                    <div class="kpi">
                        <div class="kpi-label">Exposição</div>
                        <div id="kpi-exp" class="kpi-value">—</div>
                        <div class="kpi-sub">Valor nocional</div>
                    </div>
                    <div class="kpi">
                        <div class="kpi-label">Margem</div>
                        <div id="kpi-margin" class="kpi-value">—</div>
                        <div id="kpi-lev" class="kpi-sub">Lev. —</div>
                    </div>
                    <div class="kpi">
                        <div class="kpi-label">Posições</div>
                        <div id="kpi-count" class="kpi-value">—</div>
                        <div class="kpi-sub">abertas</div>
                    </div>
                </div>
            </div>

            <!-- Positions -->
            <div>
                <div class="section-title">Posições abertas</div>
                <div id="positions-list" class="positions-list">
                    <div class="empty-state">A carregar posições...</div>
                </div>
            </div>

        </div>

        <!-- ── RIGHT: News ── -->
        <div class="news-panel">
            <div class="news-header">
                <div class="news-tabs">
                    <div class="news-tab active" onclick="setTab('ct',this)">Cointelegraph</div>
                    <div class="news-tab" onclick="setTab('bm',this)">Bitcoin Mag</div>
                </div>
                <button id="refresh-btn" class="news-refresh" onclick="refreshNews()" title="Atualizar">↻</button>
            </div>
            <div id="news-feed" class="news-feed">
                <div class="news-loading">A carregar notícias...</div>
            </div>
        </div>

    </main>
</div>

<script>
const FUNC_PATH  = 'https://yifxgiwmibjaornighvt.supabase.co/functions/v1/get-bybit-positions';
const SUPABASE_KEY = 'sb_publishable_xHjsFJbSuAhO6r6BUylTCw_tDE-nFXT';
const BYBIT = 'https://api.bybit.com';

let currentTab = 'ct';
let btcPrev = 0;

// ── Helpers ──────────────────────────────────────────────────────────────────
function fmt(n, decimals = 0) {
    const num = Number(n);
    if (isNaN(num)) return '—';
    return num.toLocaleString('pt-PT', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}
function fmtUsd(n, decimals = 0) {
    const num = Number(n);
    if (isNaN(num)) return '—';
    const abs = Math.abs(num);
    const sign = num < 0 ? '-' : '';
    if (abs >= 1e6) return `${sign}$${fmt(abs/1e6,2)}M`;
    if (abs >= 1e3) return `${sign}$${fmt(abs/1e3,1)}K`;
    return `${sign}$${fmt(abs, decimals)}`;
}
function timeAgo(dateStr) {
    const diff = Date.now() - new Date(dateStr).getTime();
    const m = Math.floor(diff / 60000);
    if (m < 1) return 'agora';
    if (m < 60) return `${m}m`;
    if (m < 1440) return `${Math.floor(m/60)}h`;
    return `${Math.floor(m/1440)}d`;
}
function colorClass(n) { return Number(n) >= 0 ? 'green' : 'red'; }
function setText(id, val) { const e = document.getElementById(id); if (e) e.textContent = val; }

// ── Market data ───────────────────────────────────────────────────────────────
async function fetchMarket() {
    try {
        const r = await fetch(`${BYBIT}/v5/market/tickers?category=inverse&symbol=BTCUSD`);
        const d = await r.json();
        const t = d?.result?.list?.[0];
        if (!t) return;

        const price = parseFloat(t.lastPrice);
        const chPct = parseFloat(t.price24hPcnt) * 100;
        const fr    = parseFloat(t.fundingRate) * 100;

        const priceEl = document.getElementById('hdr-price');
        if (priceEl) {
            priceEl.textContent = fmt(price, 0);
            priceEl.classList.remove('flash-up','flash-down');
            if (btcPrev > 0) {
                if (price > btcPrev) { priceEl.classList.add('flash-up'); setTimeout(() => priceEl.classList.remove('flash-up'), 600); }
                else if (price < btcPrev) { priceEl.classList.add('flash-down'); setTimeout(() => priceEl.classList.remove('flash-down'), 600); }
            }
            btcPrev = price;
        }

        const chEl = document.getElementById('hdr-change');
        if (chEl) {
            chEl.textContent = (chPct >= 0 ? '+' : '') + fmt(chPct, 2) + '%';
            chEl.style.color = chPct >= 0 ? 'var(--green)' : 'var(--red)';
        }

        const frEl = document.getElementById('hdr-fund');
        if (frEl) {
            frEl.textContent = (fr >= 0 ? '+' : '') + fr.toFixed(4) + '%';
            frEl.style.color = fr > 0.02 ? 'var(--red)' : fr < -0.01 ? 'var(--green)' : 'var(--dim)';
        }

        // live dot
        const dot = document.getElementById('live-dot');
        if (dot) dot.className = 'status-dot';

        // timestamp
        const now = new Date();
        setText('hdr-updated', now.toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));

    } catch(e) {
        const dot = document.getElementById('live-dot');
        if (dot) dot.className = 'status-dot stale';
    }
}

// ── Positions ─────────────────────────────────────────────────────────────────
async function fetchPositions() {
    try {
        const r = await fetch(FUNC_PATH, { headers: { 'Authorization': `Bearer ${SUPABASE_KEY}` } });
        const d = await r.json();
        const list = (d?.result?.list || []).filter(p => parseFloat(p.size) !== 0);
        renderPortfolio(list);
    } catch(e) {
        document.getElementById('positions-list').innerHTML = '<div class="empty-state">Não foi possível carregar posições.</div>';
    }
}

function renderPortfolio(positions) {
    // KPIs
    let totalPnl = 0, totalMargin = 0, totalExposure = 0;
    positions.forEach(p => {
        const pnl  = parseFloat(p.unrealisedPnl);
        const val  = parseFloat(p.positionValue);
        const lev  = parseFloat(p.leverage);
        totalPnl      += pnl;
        totalMargin   += val / lev;
        totalExposure += val;
    });
    const roe = totalMargin > 0 ? (totalPnl / totalMargin) * 100 : 0;
    const avgLev = totalMargin > 0 ? totalExposure / totalMargin : 0;

    const pnlEl = document.getElementById('kpi-pnl');
    if (pnlEl) {
        pnlEl.textContent = fmtUsd(totalPnl, 2);
        pnlEl.style.color = totalPnl >= 0 ? 'var(--green)' : 'var(--red)';
    }
    const roeEl = document.getElementById('kpi-roe');
    if (roeEl) {
        roeEl.textContent = `ROE ${roe >= 0 ? '+' : ''}${fmt(roe, 2)}%`;
        roeEl.style.color = roe >= 0 ? 'var(--green)' : 'var(--red)';
    }
    setText('kpi-exp', fmtUsd(totalExposure));
    setText('kpi-margin', fmtUsd(totalMargin, 2));
    setText('kpi-lev', `Lev. ${fmt(avgLev, 2)}x`);
    setText('kpi-count', positions.length.toString());

    // Cards
    const container = document.getElementById('positions-list');
    if (!positions.length) {
        container.innerHTML = '<div class="empty-state">Sem posições abertas na Bybit.</div>';
        return;
    }

    container.innerHTML = positions.map(p => {
        const pnl  = parseFloat(p.unrealisedPnl);
        const val  = parseFloat(p.positionValue);
        const lev  = parseFloat(p.leverage);
        const mark = parseFloat(p.markPrice);
        const entry= parseFloat(p.avgPrice);
        const liq  = parseFloat(p.liqPrice);
        const tp   = parseFloat(p.takeProfit);
        const sl   = parseFloat(p.stopLoss);
        const marg = val / lev;
        const roe  = marg > 0 ? (pnl / marg) * 100 : 0;
        const isLong = p.side === 'Buy';
        const isInv  = p.symbol.includes('USD') && !p.symbol.includes('USDT');
        const dLiq   = liq > 0 ? Math.abs((liq - mark) / mark) * 100 : 100;
        const pnlColor = pnl >= 0 ? 'var(--green)' : 'var(--red)';
        const roeColor = roe >= 0 ? 'var(--green)' : 'var(--red)';
        const dLiqColor= dLiq < 8 ? 'var(--red)' : dLiq < 20 ? 'var(--btc)' : 'var(--dim)';
        const barColor = dLiq < 8 ? '#f87171' : dLiq < 20 ? '#f7931a' : '#34d399';
        const barWidth = Math.max(2, Math.min(98, 100 - dLiq));

        return `
        <div class="pos-card">
            <div class="pos-header">
                <div class="pos-side-bar ${isLong ? 'long' : 'short'}"></div>
                <div>
                    <div class="pos-name">${p.symbol}</div>
                    <div class="pos-tags">
                        <span class="tag ${isLong ? 'tag-long' : 'tag-short'}">${isLong ? 'Long' : 'Short'}</span>
                        <span class="tag tag-lev">${lev}x</span>
                        <span class="tag ${isInv ? 'tag-inv' : 'tag-lin'}">${isInv ? 'Inverse' : 'Linear'}</span>
                    </div>
                </div>
                <div class="pos-roe">
                    <div class="roe-value" style="color:${roeColor}">${roe >= 0 ? '+' : ''}${fmt(roe, 2)}%</div>
                    <div class="roe-label">ROE</div>
                </div>
                <div class="pos-pnl">
                    <div class="pnl-value" style="color:${pnlColor}">${pnl >= 0 ? '+' : ''}${fmtUsd(pnl, 2)}</div>
                    <div class="pnl-label">PnL</div>
                </div>
            </div>
            <div class="pos-body">
                <div class="pos-field">
                    <div class="pos-field-label">Entrada</div>
                    <div class="pos-field-val">${fmt(entry, 2)}</div>
                </div>
                <div class="pos-field">
                    <div class="pos-field-label">Mark</div>
                    <div class="pos-field-val btc">${fmt(mark, 2)}</div>
                </div>
                <div class="pos-field">
                    <div class="pos-field-label">Liquidação</div>
                    <div class="pos-field-val red">${liq > 0 ? fmt(liq, 2) : '—'}</div>
                </div>
                <div class="pos-field">
                    <div class="pos-field-label">Tamanho</div>
                    <div class="pos-field-val">${fmtUsd(val)}</div>
                </div>
                <div class="pos-field">
                    <div class="pos-field-label">Margem</div>
                    <div class="pos-field-val">${fmtUsd(marg, 2)}</div>
                </div>
                <div class="pos-field">
                    <div class="pos-field-label">TP / SL</div>
                    <div class="pos-field-val">
                        ${tp > 0 ? `<span style="color:var(--green)">${fmt(tp, 0)}</span>` : '<span style="color:var(--muted)">—</span>'}
                        <span style="color:var(--muted)"> / </span>
                        ${sl > 0 ? `<span style="color:var(--red)">${fmt(sl, 0)}</span>` : '<span style="color:var(--muted)">—</span>'}
                    </div>
                </div>
            </div>
            <div class="pos-footer">
                <div class="dist-row">
                    <span class="dist-label">Distância à liquidação</span>
                    <span class="dist-pct${dLiq < 8 ? ' pulse' : ''}" style="color:${dLiqColor}">${fmt(dLiq, 1)}%</span>
                </div>
                <div class="bar-track">
                    <div class="bar-fill" style="width:${barWidth}%;background:${barColor}"></div>
                </div>
            </div>
        </div>`;
    }).join('');
}

// ── News ──────────────────────────────────────────────────────────────────────
const RSS = {
    ct: 'https://api.rss2json.com/v1/api.json?rss_url=https://cointelegraph.com/rss/tag/bitcoin&count=30',
    bm: 'https://api.rss2json.com/v1/api.json?rss_url=https://bitcoinmagazine.com/.rss/full&count=20'
};
const SOURCE_NAME = { ct: 'Cointelegraph', bm: 'Bitcoin Magazine' };

function setTab(tab, el) {
    currentTab = tab;
    document.querySelectorAll('.news-tab').forEach(t => t.classList.remove('active'));
    if (el) el.classList.add('active');
    loadNews(tab);
}

async function loadNews(tab) {
    const feed = document.getElementById('news-feed');
    feed.innerHTML = '<div class="news-loading">A carregar...</div>';
    try {
        const r = await fetch(RSS[tab]);
        const d = await r.json();
        if (!d?.items?.length) throw new Error('no items');
        feed.innerHTML = d.items.map(item => `
            <div class="news-item" onclick="window.open('${item.link}','_blank')">
                <div class="news-source-row">
                    <span class="news-source">${SOURCE_NAME[tab]}</span>
                    <div class="news-dot"></div>
                    <span class="news-time">${timeAgo(item.pubDate)}</span>
                </div>
                <div class="news-title">${item.title}</div>
            </div>`
        ).join('');
    } catch(e) {
        feed.innerHTML = '<div class="news-loading">Não foi possível carregar notícias.</div>';
    }
}

function refreshNews() {
    const btn = document.getElementById('refresh-btn');
    if (btn) { btn.classList.add('spinning'); setTimeout(() => btn.classList.remove('spinning'), 700); }
    loadNews(currentTab);
}

// ── Init ──────────────────────────────────────────────────────────────────────
(async () => {
    await Promise.all([fetchMarket(), fetchPositions(), loadNews('ct')]);
    setInterval(fetchMarket,    5000);
    setInterval(fetchPositions, 10000);
})();
</script>
