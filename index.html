<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>FleetWise Portfolio Dashboard</title>
    <style>
        body { background-color: #131722; color: #d1d4dc; font-family: sans-serif; display: flex; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 900px; background: #1e222d; padding: 20px; border-radius: 8px; border: 1px solid #363c4e; }
        .header { display: flex; justify-content: space-between; margin-bottom: 30px; border-bottom: 1px solid #363c4e; padding-bottom: 20px; }
        .stat-box { display: flex; flex-direction: column; }
        .stat-label { font-size: 12px; color: #787b86; text-transform: uppercase; }
        .stat-value { font-size: 24px; font-weight: bold; margin-top: 5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; color: #787b86; font-size: 12px; padding: 10px; border-bottom: 1px solid #363c4e; }
        td { padding: 15px 10px; border-bottom: 1px solid #2a2e39; }
        .up { color: #089981; }
        .down { color: #f23645; }
        .avg { color: #ff9800; }
        .liq-alert { background-color: rgba(242, 54, 69, 0.2); border-radius: 4px; padding: 2px 5px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="stat-box">
            <span class="stat-label">Market Value Total</span>
            <span class="stat-value" id="total-mkt">$0.00</span>
        </div>
        <div class="stat-box">
            <span class="stat-label">Total P/L</span>
            <span class="stat-value" id="total-pnl">$0.00 (0%)</span>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>SYMBOL</th>
                <th>AVG PRICE</th>
                <th>MARKET VALUE</th>
                <th>NET P/L %</th>
                <th>NET P/L</th>
                <th>LIQUIDATION</th>
            </tr>
        </thead>
        <tbody id="portfolio-body">
            </tbody>
    </table>
</div>

<script>
    // DADOS DOS TEUS TRADES (Podes editar estes valores)
    const portfolio = [
        { symbol: "DOTUSDT", avg: 1.484, qty: 3121.68, current: 7.25, lev: 1.0 },
        { symbol: "APTUSDT", avg: 1.2558, qty: 3313.46, current: 8.40, lev: 2.5 }
    ];

    function updateDashboard() {
        let totalMkt = 0;
        let totalCost = 0;
        let totalPnl = 0;
        const body = document.getElementById('portfolio-body');
        body.innerHTML = '';

        portfolio.forEach(item => {
            const mktVal = item.qty * item.current;
            const costVal = item.qty * item.avg;
            const pnl = mktVal - costVal;
            const pnlPerc = (pnl / costVal) * 100;
            const liqPrice = item.avg * (1 - (0.94 / item.lev));
            
            totalMkt += mktVal;
            totalCost += costVal;
            totalPnl += pnl;

            // Alerta de Liquidação (se preço estiver a menos de 10% da liq)
            const isRisk = (item.current - liqPrice) / item.current < 0.10;

            body.innerHTML += `
                <tr>
                    <td><b>${item.symbol}</b></td>
                    <td class="avg">${item.avg.toFixed(4)}</td>
                    <td>$${mktVal.toLocaleString()}</td>
                    <td class="${pnlPerc >= 0 ? 'up' : 'down'}">${pnlPerc.toFixed(2)}%</td>
                    <td class="${pnl >= 0 ? 'up' : 'down'}">$${pnl.toLocaleString()}</td>
                    <td class="${isRisk ? 'liq-alert down' : ''}">${liqPrice.toFixed(4)}</td>
                </tr>
            `;
        });

        const totalPnlPerc = (totalPnl / totalCost) * 100;
        document.getElementById('total-mkt').innerText = `$${totalMkt.toLocaleString()}`;
        document.getElementById('total-pnl').innerText = `$${totalPnl.toLocaleString()} (${totalPnlPerc.toFixed(2)}%)`;
        document.getElementById('total-pnl').className = `stat-value ${totalPnl >= 0 ? 'up' : 'down'}`;
    }

    updateDashboard();
</script>

</body>
</html>
